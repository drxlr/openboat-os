# ── Anodes ───────────────────────────────────────────────────────────────────────────
[[kit]]
item = "anodes"
title = "Sacrificial anodes"
note = """
The alloy is the decision, not the price: zinc in salt, aluminium in brackish, magnesium \
only in fresh. The wrong alloy protects nothing and looks exactly like the right one."""

[[kit.line]]
part = "Anode set, drive"
number = "DEMO-AN-SET"
