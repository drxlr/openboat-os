[[kit]]
item = "oil"
title = "Engine oil and filter change"
note = """
Quantity is the thing to get right here, and it is not the sump capacity: it is the sump \
plus what stays in the filter. Buy the round number above it, not below."""

[[kit.line]]
part = "Marine engine oil, 25W-40"
number = "DEMO-OIL-25W40-5L"
