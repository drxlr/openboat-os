/* ── app: weather ─────────────────────────────────────────────────────────────────── */
OS.app({
  id:'weather', title:'Weather',
  render(el, st) {
    if (!st.windows) return empty(el, 'Fetching the forecast', 'One call to Open-Meteo, no key. If the boat has no internet this stays empty — the helm does not need it.');
    // The API ranks windows longest-first, which is the right answer to "which is best"
    // and the wrong order for a list headed "next seven days" — it printed Thursday above
    // Wednesday and read as a bug. Ranked once for the verdict, then shown in day order
    // with the best one marked, so both questions get answered.
    const d = st.windows;
    const byDay = [...d.windows].sort((a,b)=>new Date(a.start)-new Date(b.start));
    const soonest = byDay[0];
    const best = [...d.windows].sort((a,b)=>b.hours-a.hours||new Date(a.start)-new Date(b.start))[0];
    const verdict = soonest
      ? `<div class="lead">Yes — <span class="when">${fmt(soonest.start)}</span></div>
         <div class="quiet">${soonest.hours} h window, up to ${Math.round(soonest.wind_kn)} kn
         gusting ${Math.round(soonest.gust_kn)}${soonest.wave_m!=null?`, sea ${soonest.wave_m.toFixed(1)} m`:''}</div>`
      : `<div class="lead bad">Nothing <span class="when">this week</span>.</div>`;

    let strip = '', ticks = '';
    if (st.forecast) {
      const hrs = st.forecast.hours.slice(0, 72);
      const peak = Math.max(...hrs.map(h => h.gust_kn), 25);
      strip = hrs.map(h => {
        const grade = h.wind_kn <= 12 ? 'ok' : h.wind_kn <= 18 ? 'mid' : 'badf';
        const local = new Date(h.time).getHours();
        const night = (local < 7 || local >= 19) ? ' night' : '';
        return `<div class="barw${night}" style="height:${Math.round(h.gust_kn/peak*80)}px"
          title="${fmt(h.time)} — ${h.wind_kn.toFixed(0)} kn gust ${h.gust_kn.toFixed(0)} ${h.wind_name}">
          <div class="f ${grade}" style="height:${Math.round(h.wind_kn/peak*80)}px"></div></div>`;
      }).join('');
      ticks = hrs.map(h => { const t = new Date(h.time), n = t.getHours();
        return n === 0 ? `<span class="day">${DAYS[t.getDay()]}</span>`
                       : `<span>${n % 6 === 0 ? n : ''}</span>`; }).join('');
    }

    el.innerHTML = `
      <div class="card"><h2>Can we go out?</h2>${verdict}</div>
      <div class="card"><h2>Windows, next seven days</h2>
        <ul class="rows">${byDay.map(w => `<li>
          <span>${fmt(w.start)} → ${hhmm(new Date(w.end))}${
            w === best && byDay.length > 1 ? ' <span class="pick">longest</span>' : ''}</span>
          <span class="n"><span class="len">${w.hours} h</span> · ${Math.round(w.wind_kn)} kn
          gust ${Math.round(w.gust_kn)}${w.wave_m!=null?` · ${w.wave_m.toFixed(1)} m`:''}</span>
        </li>`).join('') || '<li>No window inside the limits.</li>'}</ul>
        <p class="quiet" style="margin:.7rem 0 0">Forecast point
          ${d.point[0].toFixed(4)}, ${d.point[1].toFixed(4)} — the sea, not the berth:
          the marina's grid cell is land-influenced and reads gusts about half again too
          high. Limits are up to ${d.limits.max_wind_kn} kn, gusts ${d.limits.max_gust_kn} kn,
          sea ${d.limits.max_wave_m} m, between ${d.limits.daylight[0]} and
          ${d.limits.daylight[1]}. Change them under <code>[limits]</code> in your profile.</p>
      </div>
      <div class="card"><h2>Wind, next 72 hours</h2>
        <div class="strip">${strip}</div><div class="ticks">${ticks}</div>
        <p class="quiet" style="margin:.6rem 0 0">Knots. The solid bar is the sustained
          wind, the pale one behind it the gust. Night hours are dimmed.</p>
      </div>`;
  }
});

/* ── app: chart ───────────────────────────────────────────────────────────────────── */
// Filled from /api/profile before the chart opens; never a literal in this file.
const HOME = (window.OB_HOME || [0, 0]);
let map, boatMark, marks = [], line = null, waypoints = [];

OS.app({
  id:'chart', title:'Chart',
  mount(el) {
    // Leaflet and the tiles come from the internet. Aboard, there often is none — say so
    // and leave the rest of the page alone.
    if (typeof L === 'undefined') {
      this.dead = true;
      return empty(el, 'The chart needs the internet',
        'The map library and the tiles load from the network and did not arrive. Route planning waits until the tablet has a connection; every other page works without one.');
    }
    el.innerHTML = `<div class="card"><h2>Route</h2><div id="map"></div>
      <p class="quiet" style="margin:.8rem 0 0;display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <span>Tap to drop waypoints; seamarks are the OpenSeaMap overlay.</span>
        <button class="act" id="clear">Clear route</button>
        <a class="quiet" href="https://www.openstreetmap.org/fixthemap" target="_blank"
           rel="noopener">Report a map issue</a></p>
      <div class="lead n" id="rtotal" style="margin-top:.7rem"></div>
      <div id="rlegs" style="font-size:.95rem"></div>
      <p class="warntext">No land, depth or restricted-area check. Verify every route on a
        real chart.</p></div>`;

    // Tile sources come from the profile, never from here. Two reasons, both practical:
    // OSM's tile policy asks that the URL be switchable without a software update, and
    // pointing base_url at an MBTiles server aboard is the one legal way to get a chart
    // that works offline. See docs/CHARTS.md.
    const C = (window.OB_PROFILE && window.OB_PROFILE.chart) || {};
    const zmax = C.max_zoom || 18;
    map = L.map('map').setView(HOME, 11);
    L.tileLayer(C.base_url || 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:zmax, attribution:C.base_attribution || '© OpenStreetMap contributors'})
      .addTo(map);
    L.tileLayer(C.seamark_url || 'https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',
      {maxZoom:zmax, attribution:C.seamark_attribution || '© OpenSeaMap (CC BY-SA 2.0)'})
      .addTo(map);
    // A circle in the palette rather than Leaflet's default blue pin: the pin is a raster
    // image, so it ignores the palette and glows blue on the night chart.
    L.circleMarker(HOME, {radius:7, color:'var(--good)', fillColor:'var(--good)',
                          fillOpacity:.9, weight:2})
      .addTo(map).bindPopup(window.OB_BERTH_NAME || 'Berth');
    boatMark = L.circleMarker(HOME, {radius:8, color:'#A93E2F', fillOpacity:1});

    map.on('click', e => {
      waypoints.push([e.latlng.lat, e.latlng.lng]);
      marks.push(L.circleMarker(e.latlng, {radius:6, color:'#1E6B8C', fillOpacity:1})
        .addTo(map).bindTooltip('WP' + waypoints.length));
      route();
    });
    document.getElementById('clear').onclick = () => {
      marks.forEach(m => map.removeLayer(m));
      if (line) map.removeLayer(line);
      waypoints = []; marks = []; line = null;
      document.getElementById('rtotal').textContent = '';
      document.getElementById('rlegs').innerHTML = '';
    };
  },
  render(el, st) {
    if (this.dead) return;
    setTimeout(() => map.invalidateSize(), 0);
    if (st.boat?.lat) boatMark.setLatLng([st.boat.lat, st.boat.lon]).addTo(map);
    else map.removeLayer(boatMark);
  }
});

async function route() {
  if (line) map.removeLayer(line);
  line = L.polyline(waypoints, {color:'#1E6B8C', weight:3, dashArray:'6 5'}).addTo(map);
  if (waypoints.length < 2) return;
  const q = waypoints.map((w, i) => `${w[0]},${w[1]},WP${i+1}`).join(';');
  const r = await fetch(`/api/route?speed_kn=20&litres_per_hour=60&waypoints=${encodeURIComponent(q)}`)
    .then(x => x.json());
  if (r.error) { document.getElementById('rtotal').textContent = r.error; return; }
  document.getElementById('rtotal').textContent =
    `${r.distance_nm.toFixed(1)} nm · ${r.hours.toFixed(1)} h at 20 kn · about ${r.fuel_litres.toFixed(0)} L`;
  document.getElementById('rlegs').innerHTML = r.legs.map(l => {
    const w = l.weather;
    const wx = w ? `${Math.round(w.wind_kn)} kn ${w.wind_name} Bft${w.beaufort}` +
      (w.wave_m != null ? `, sea ${w.wave_m.toFixed(1)} m` : '') : 'no forecast';
    return `<div class="n" style="padding:.4rem 0;border-top:1px solid var(--rule-soft)">
      ${l.from} → ${l.to}: ${l.distance_nm.toFixed(1)} nm ${l.bearing_deg}° ${l.bearing_name}
      · ${hhmm(new Date(l.depart))}–${hhmm(new Date(l.arrive))} · ${wx}</div>`;
  }).join('');
}

OS.app({
  id:'anchor', title:'Anchor',
  render(el, st) {
    const b = st.boat;
    el.innerHTML = `<div class="card"><h2>Anchor watch</h2>
      <div class="lead">Runs on the boat, not in this tab.</div>
      <p class="quiet">A watch that only works while a browser is open is not a watch. The
        real one is <code>50-anchor-watch/anchor.py</code> on the Pi, which keeps running
        with every screen asleep and alarms through Signal K.</p>
      <p class="quiet">It tells swinging from dragging by fitting the centre of the swing
        circle: a boat lying to its anchor sweeps an arc about a fixed point, a dragging
        boat's centre walks. That fires while the boat is still well inside the alarm
        radius — and it does not mistake more scope for a drag, which a plain range alarm
        cannot help doing.</p>
      <p class="quiet n">${b?.lat
        ? `Boat now at ${b.lat.toFixed(5)}, ${b.lon.toFixed(5)}, depth ${fmtNum(b.depth_m,1)} m —
           <code>python3 50-anchor-watch/anchor.py --rode 35 --depth ${fmtNum(b.depth_m,0,'8')}</code>`
        : 'No position, so no anchor can be marked.'}</p></div>`;
  }
});

/* ── apps: the two generated reports, held in frame rather than linked ────────────── */
[['season','Season','/reports/season.html','Ten years of ERA5 for this berth.'],

/* ── app: the companion ───────────────────────────────────────────────────────────
   Ask the boat about itself. Three sources, kept visibly apart because they have very
   different standing: passages quoted out of the owner's own documents, the readings the
   boat is giving right now, and what has been checked before.

   It does not write prose about the boat, and that is the design rather than a limitation.
   Everything on this screen is either a quote with the file and line it came from, or a
   live number. The one place this project has ever been dangerous is a confident sentence
   with no source under it.                                                              */
OS.app({
  id:'ask', title:'Ask',
  mount(el) {
    el.innerHTML = `
      <div class="card">
        <h2>Ask the boat</h2>
        <div class="askbar">
          <input id="q" class="askin" type="search" enterkeyhint="search"
                 autocomplete="off" autocapitalize="sentences"
                 placeholder="which cap do I unscrew to flush it?">
          <button class="act" id="go">Ask</button>
        </div>
        <div id="seeds" class="seeds"></div>
      </div>
      <div id="answer"></div>`;

    const seeds = ['how do I flush the engine', 'what engine is in it',
                   'when was the impeller last done', 'manifold riser overheating',
                   'insurance', 'what is the draft'];
    el.querySelector('#seeds').innerHTML = seeds
      .map(s => `<button class="seed" data-q="${s}">${s}</button>`).join('');

    const box = el.querySelector('#answer'), input = el.querySelector('#q');
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    // Markdown, only as far as these documents actually use it. A full parser here would be
    // a lot of code to make a quote look like the file it came from; bold, code and the
    // bullet/step shape carry nearly all of it.
    const light = s => esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/^&gt; ?(.*)$/gm, '<i>$1</i>')
      .replace(/\n/g, '<br>');

    const ask = async (question) => {
      if (!question.trim()) return;
      input.value = question;
      box.innerHTML = `<div class="card"><p class="quiet">Reading the boat's papers…</p></div>`;
      let d;
      try { d = await fetch('/api/ask?q=' + encodeURIComponent(question) + '&limit=5').then(r => r.json()); }
      catch (e) { box.innerHTML = `<div class="card"><p class="quiet">The server did not answer.</p></div>`; return; }

      if (d.error) { box.innerHTML = `<div class="card"><p class="quiet">${esc(d.error)}</p></div>`; return; }

      if (!d.documents) {
        box.innerHTML = `<div class="card"><h2>No documents</h2>
          <p class="quiet">This boat has no papers pointed at yet. Add them under
          <code>[knowledge]</code> in the profile:</p>
          <pre class="snip">[knowledge]
docs = ["~/boat/survey.md", "~/boat/log.md"]</pre>
          <p class="quiet">They are read where they lie — nothing is copied or uploaded.</p></div>`;
        return;
      }

      const live = d.live && d.live.online ? d.live : null;
      // The names here are the ones /api/state actually uses. Guessed at first — rpm was
      // the only one that matched, so the line quietly showed a quarter of the truth.
      const liveBits = live ? [
        live.rpm != null ? `${Math.round(live.rpm)} rpm` : null,
        live.coolant_c != null ? `coolant ${live.coolant_c.toFixed(1)} °C` : null,
        live.oil_bar != null ? `oil ${live.oil_bar.toFixed(2)} bar` : null,
        live.volts != null ? `battery ${live.volts.toFixed(2)} V` : null,
        live.fuel_pct != null ? `fuel ${Math.round(live.fuel_pct)} %` : null,
        live.depth_m != null ? `depth ${live.depth_m.toFixed(1)} m` : null,
      ].filter(Boolean) : [];

      const passages = d.passages.length ? d.passages.map(p => `
        <div class="quote">
          <div class="qhead"><b>${esc(p.heading)}</b><span class="src">${esc(p.where)}</span></div>
          <div class="qbody">${light(p.text.slice(0, 1400))}${p.text.length > 1400 ? '…' : ''}</div>
        </div>`).join('')
        : `<p class="quiet">Nothing in the boat's papers matches that. The documents are
           searched by word, in German and English both — try the words the file itself
           would use.</p>`;

      const checks = (d.checks || []).length ? `
        <div class="card"><h2>Checked before</h2><ul class="rows">${d.checks.map(c => `
          <li><span>${esc(c.what)}${c.found ? ' — ' + esc(c.found) : ''}</span>
              <span class="n">${esc((c.at || '').slice(0, 10))} · ${esc(c.verdict)}</span></li>`
        ).join('')}</ul></div>` : '';

      box.innerHTML = `
        <div class="card">
          <h2>From the boat's papers</h2>
          ${liveBits.length ? `<p class="quiet">Right now: ${liveBits.join(' · ')}</p>` : ''}
          ${passages}
        </div>
        ${checks}
        <div class="card">
          <h2>Log what you checked</h2>
          <p class="quiet">Recorded with the readings the boat is giving at this moment, so
            next season the entry still means something.</p>
          <div class="askbar">
            <input id="lw" class="askin" placeholder="what you looked at" value="${esc(input.value)}">
            <input id="lf" class="askin" placeholder="what you found">
          </div>
          <div class="verdicts">
            ${['ok','watch','act','noted'].map(v =>
              `<button class="act vbtn" data-v="${v}">${v}</button>`).join('')}
          </div>
          <p class="quiet" id="logmsg"></p>
        </div>`;

      box.querySelectorAll('.vbtn').forEach(b => b.onclick = async () => {
        const what = box.querySelector('#lw').value.trim();
        const msg = box.querySelector('#logmsg');
        if (!what) { msg.textContent = 'Say what you looked at.'; return; }
        try {
          const r = await fetch('/api/logbook', {method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({what, found: box.querySelector('#lf').value,
                                  verdict: b.dataset.v, by:'dashboard'})}).then(x => x.json());
          msg.textContent = r.error ? r.error
            : `Logged “${r.logged.what}” as ${r.logged.verdict}.`;
        } catch (e) { msg.textContent = 'Could not write the log.'; }
      });
    };

    el.querySelector('#go').onclick = () => ask(input.value);
    input.onkeydown = e => { if (e.key === 'Enter') ask(input.value); };
    el.querySelectorAll('.seed').forEach(b => b.onclick = () => ask(b.dataset.q));
  }
});

   Registered conditionally rather than shown-and-disabled: a tab that exists only to say

      <iframe class="report" src="/windy.html" title="Weather chart" loading="lazy"></iframe>`;

/* ── app: about ───────────────────────────────────────────────────────────────────── */
function aboutSenders(st) {
  const data = st.paths;
  if (!data) return `<p class="quiet">Reading what Signal K is publishing…</p>`;
  if (!data.online) {
    return `<p class="quiet">Signal K is not answering${data.reason ? ' — ' + esc(data.reason) : ''}.
      Paths in <code>boat.toml</code> still stand; they will bind when the boat does.</p>`;
  }
  const mapped = data.mapped || {};
  const byPath = {};
  (data.paths || []).forEach(row => { byPath[row.path] = row; });
  const interesting = (data.paths || []).filter(row =>
    /^(propulsion|electrical|tanks|environment|steering)\./.test(row.path));
  const rows = Object.keys(mapped).sort().map(key => {
    const path = mapped[key];
    const live = byPath[path];
    const mark = live ? 'live' : 'no sender';
    return `<li><span>${esc(key)}</span><span class="n">${esc(path)} · ${mark}</span></li>`;
  }).join('');
  const extras = interesting.filter(row =>
    !Object.values(mapped).includes(row.path));
  const extra = extras.slice(0, 24).map(row =>
    `<li><span class="quiet">${esc(row.path)}</span><span class="n">${
      row.unit ? esc(String(row.unit)) : 'live'}</span></li>`).join('');
  return `<ul class="rows">${rows}</ul>
    ${extras.length
      ? `<p class="quiet" style="margin-top:.8rem">Also publishing, not mapped in
          <code>[paths]</code> — copy a line into <code>boat.toml</code> to bind it.</p>
         <ul class="rows">${extra}</ul>
         ${extras.length > 24
           ? `<p class="quiet">${extras.length - 24} more on <code>GET /api/paths</code>.</p>`
           : ''}`
      : `<p class="quiet" style="margin-top:.8rem">Nothing else under propulsion,
          electrical, tanks, environment or steering.</p>`}`;
}

OS.app({
  id:'about', title:'About',
  render(el, st) {
    const p = window.OB_PROFILE || {};
    const v = p.vessel || {};
    const dims = [];
    if (v.length_m) dims.push(Number(v.length_m).toFixed(2).replace('.', ',') + ' m');
    if (v.beam_m) dims.push(Number(v.beam_m).toFixed(2).replace('.', ',') + ' m beam');
    if (v.draft_m) dims.push('draft ' + Number(v.draft_m).toFixed(2).replace('.', ',') + ' m');
    const boatLine = [v.name || 'OpenBoat'].concat(dims).join(' · ') || '—';
    const engineBits = [];
    if (v.engine_kw) engineBits.push(Number(v.engine_kw).toFixed(0) + ' kW');
    if (v.engine_note) engineBits.push(v.engine_note);
    const unsourced = (p.unsourced && p.unsourced.length)
      ? ' Unsourced right now: ' + p.unsourced.join(', ') + '.'
      : '';
    if (!st._pathsFetch && (!st.paths || Date.now() - (st.pathsAt || 0) > 15000)) {
      OS.state._pathsFetch = true;
      fetch('/api/paths').then(r => r.json()).then(data => {
        OS.state.paths = data; OS.state.pathsAt = Date.now();
        if (OS.current === 'about') OS.paint();
      }).catch(() => {}).finally(() => { OS.state._pathsFetch = false; });
    }
    el.innerHTML = `<div class="card"><h2>What this is, and what it is not</h2>
      <p>An instrument panel and a planning desk for one boat, reading a Signal K server
         over the network. Everything here is read-only: nothing steers, switches, sends
         or pays.</p>
      <ul class="rows">
        <li><span>Boat</span><span class="n">${esc(boatLine)}</span></li>
        <li><span>Engine</span><span class="n">${esc(engineBits.join(' · ') || 'not recorded')}</span></li>
        <li><span>Signal K</span><span class="n">${st.boat ? 'answering' : (st.reason || 'not answering')}</span></li>
      </ul>
      <p class="warntext" style="margin-top:.8rem">Not a chartplotter and not a safety
        device. Routes are arithmetic over waypoints — they know nothing about land, depth
        or restricted areas. Fuel figures multiply hours by a burn rate that is only worth
        anything once somebody has measured it on this engine.</p>
      <p class="quiet">Every figure above comes from your <code>boat.toml</code>. A field
        with no source is listed as unsourced rather than presented as a fact, and where a
        number is unknown it stays blank rather than being estimated.
        ${esc(unsourced)}</p></div>
      <div class="card"><h2>What the boat is publishing</h2>
      <p class="quiet">Instance names differ. This list is the live Signal K tree against
        the <code>[paths]</code> table in your profile — that is how a Victron bank, a
        second engine or a tank that is not called <code>main</code> gets onto the helm.</p>
      ${aboutSenders(st)}</div>
      <div class="card"><h2>Using the screen</h2>
      <p class="quiet"><b>Palette.</b> Day, dusk and night follow the sun's height over
        the boat. Tap the button at the bottom right for the next palette; hold it to go
        back to automatic. At night, also turn the tablet's brightness down — the palette
        chooses colours, the tablet chooses how much light reaches your eyes.</p>
      <p class="quiet"><b>Arranging.</b> On the Helm, <em>Arrange</em> lets you drag tiles,
        tap one for its size, hide it or move it, and keep more than one page. The layout
        is saved on this device as a small document; <em>Reset layout</em> brings the
        default back.</p>
      <p class="quiet"><b>Swipe</b> left or right to move between the apps.</p></div>`;
  }
});

OS.start();
</script>
