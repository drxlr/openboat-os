<title>OpenBoat</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Three palettes, one set of token names. Everything below reads tokens, never hex, so
     the whole page — helm tiles, weather, chart chrome — follows the palette.

     day    sun-readable: white tiles, near-black numerals. Measured 18.6:1 on numerals,
            13.0:1 on labels, 7.9:1 on the small line — all past WCAG AAA (7:1).
     dusk   the boat's dark palette, neutral, full colour. 14.2:1 / 9.6:1 / 6.1:1.
     night  red on black to spare night vision. A red hue cannot pass 7:1 on black
            without adding green, so the numeral is an orange-red at 7.2:1 and the labels
            sit at 5.2:1; the rest is deliberately dim.
     The numbers are computed, not eyeballed — see docs/openboat/70-helm-ui.md.        */
  :root {
    color-scheme:light;
    --paper:#EEF1EF; --panel:#FFFFFF; --ink:#0F1412; --ink-soft:#2B3330; --muted:#4A5350;
    --rule:#7E8984; --rule-soft:#C9D0CC;
    --red:#B3261E; --water:#175E7E; --rust:#7A5200; --good:#2B6B3E;
    --bar:#FFFFFF; --panel-bad:#FFF4F2; --shadow:none; --lift:0 14px 34px rgba(15,20,18,.28);
  }
  :root[data-mode="dusk"] {
    color-scheme:dark;
    --paper:#15181A; --panel:#1D2123; --ink:#EEF0ED; --ink-soft:#C2C8C4; --muted:#98A09C;
    --rule:#6B7578; --rule-soft:#2E3436;
    --red:#F07A66; --water:#74BBD9; --rust:#E3A75E; --good:#7CBD8F;
    --bar:#1A1E20; --panel-bad:#33201D; --lift:0 14px 34px rgba(0,0,0,.6);
  }
  :root[data-mode="night"] {
    color-scheme:dark;
    --paper:#000000; --panel:#0A0303; --ink:#FF6A3C; --ink-soft:#E0512E; --muted:#B4401F;
    --rule:#5C2116; --rule-soft:#2A0E09;
    --red:#FF8A60; --water:#FF6A3C; --rust:#FF6A3C; --good:#E0512E;
    --bar:#050101; --panel-bad:#3A0C05; --lift:0 14px 34px rgba(0,0,0,.9);
  }
  /* Fallback only: the script below sets data-mode before first paint. If it cannot run,
     the OS preference still decides between the sun palette and the dark one. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-mode]) {
      color-scheme:dark;
      --paper:#15181A; --panel:#1D2123; --ink:#EEF0ED; --ink-soft:#C2C8C4; --muted:#98A09C;
      --rule:#6B7578; --rule-soft:#2E3436;
      --red:#F07A66; --water:#74BBD9; --rust:#E3A75E; --good:#7CBD8F;
      --bar:#1A1E20; --panel-bad:#33201D;
    }
  }

  /* Numerals: system sans, tabular figures, so 9.8 → 10.1 never shifts the tile. Sizes are
     per viewport class, not fluid — a helm value has a known reading distance.
       tablet landscape   S 60 px ≈ 7.5 mm cap height on the Pixel Tablet (276 ppi, 2×)
       tablet portrait    S 50 px
       phone              S 42 px                                                     */
  :root { --cols:4; --rows:3; --ratio:.72; --gap:12px; --side:16px;
          --num-s:60px; --num-m:78px; --num-l:108px; --top:64px; --dock:72px; }
  @media (max-width:1099px) { :root { --cols:3; --num-s:50px; --num-m:66px; --num-l:92px; } }
  @media (max-width:1099px) and (orientation:portrait) { :root { --rows:4; --ratio:1.05; } }
  @media (max-width:599px)  { :root { --cols:2; --side:12px; --gap:10px;
                                      --num-s:42px; --num-m:56px; --num-l:74px; } }

  *,*::before,*::after { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink); font-size:18px; line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  .n { font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
       font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .num { font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.015em; }
  a { color:var(--water); }
  button { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--water); outline-offset:3px; border-radius:8px; }
  svg { fill:none; }

  /* --- the shell: a top bar for identity and the page you are arranging, a dock at the
         bottom for the apps and the palette. Every control in both is at least 56 px. --- */
  .top { position:sticky; top:0; z-index:40; background:var(--bar);
         border-bottom:1px solid var(--rule-soft); height:var(--top);
         display:flex; align-items:center; gap:.6rem; padding:0 var(--side); }
  .top h1 { margin:0; font-size:1.25rem; letter-spacing:-.02em; white-space:nowrap; }
  .top .sub { color:var(--muted); font-size:.95rem; white-space:nowrap; }
  .pages { display:flex; gap:6px; margin-left:.3rem; overflow-x:auto; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .chip { min-height:56px; min-width:56px; padding:0 1.1rem; border-radius:14px;
          border:2px solid transparent; background:none; color:var(--muted); font-weight:600;
          font-size:1.05rem; cursor:pointer; white-space:nowrap; }
  .chip[aria-pressed="true"] { color:var(--ink); border-color:var(--rule); background:var(--panel); }
  .link { margin-left:auto; min-height:44px; display:inline-flex; align-items:center; gap:.5rem;
          padding:0 .9rem; border:2px solid var(--rule-soft); border-radius:999px;
          font-size:1rem; font-weight:600; color:var(--muted); white-space:nowrap; }
  .link::before { content:""; width:14px; height:14px; border-radius:50%; background:var(--rule);
                  flex:0 0 auto; }
  .link.on { color:var(--good); border-color:var(--good); }
  .link.on::before { background:var(--good); }
  .link.stale { color:var(--rust); border-color:var(--rust); }
  .link.stale::before { background:var(--rust); }
  .tool { min-height:56px; min-width:56px; padding:0 1.1rem; border-radius:14px;
          border:2px solid var(--rule); background:var(--panel); color:var(--ink);
          font-weight:600; font-size:1.05rem; cursor:pointer; display:inline-flex;
          align-items:center; gap:.5rem; white-space:nowrap; }
  .tool svg { width:24px; height:24px; stroke:currentColor; stroke-width:2.2;
              stroke-linecap:round; stroke-linejoin:round; }
  .tool.on { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  @media (max-width:599px) {
    .top .sub { display:none; }
    .link { padding:0; width:44px; justify-content:center; font-size:0; }
    .link::before { width:16px; height:16px; }
    .tool .word { display:none; }
    .tool { padding:0; width:56px; justify-content:center; }
  }

  main { max-width:1480px; margin:0 auto; touch-action:pan-y;
         padding:var(--gap) var(--side) calc(var(--dock) + env(safe-area-inset-bottom) + var(--gap)); }
  body.sheet-open main { padding-bottom:calc(var(--dock) + env(safe-area-inset-bottom) + var(--sheet, 200px)); }
  .app[hidden] { display:none; }

  .dock { position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--bar);
          border-top:1px solid var(--rule-soft); display:flex; align-items:stretch;
          height:calc(var(--dock) + env(safe-area-inset-bottom));
          padding-bottom:env(safe-area-inset-bottom); }
  nav { flex:1 1 auto; display:flex; overflow-x:auto; scrollbar-width:none; min-width:0; }
  nav::-webkit-scrollbar { display:none; }
  nav button { flex:0 0 auto; min-width:96px; min-height:56px; padding:0 1.15rem;
    background:none; border:0; border-top:4px solid transparent; color:var(--muted);
    font-size:1.05rem; font-weight:600; cursor:pointer; }
  nav button[aria-selected="true"] { color:var(--ink); border-top-color:var(--water); }
  .mode { flex:0 0 auto; min-width:128px; border:0; border-left:1px solid var(--rule-soft);
          background:none; color:var(--ink); cursor:pointer; display:flex; align-items:center;
          gap:.6rem; padding:0 1rem; text-align:left; user-select:none; -webkit-user-select:none; }
  .mode svg { width:28px; height:28px; stroke:currentColor; stroke-width:2; stroke-linecap:round;
              stroke-linejoin:round; flex:0 0 auto; }
  .mode b { display:block; font-size:1.05rem; line-height:1.15; }
  .mode small { display:block; font-size:.8rem; color:var(--muted); line-height:1.15; }
  @media (max-width:599px) { .mode { min-width:100px; padding:0 .7rem; } .mode small { display:none; } }

  .card { background:var(--panel); border:2px solid var(--rule-soft); border-radius:14px;
          padding:1.1rem 1.2rem; margin-bottom:.9rem; }
  .card h2 { margin:0 0 .7rem; font-size:1rem; font-weight:600; letter-spacing:-.01em; }
  .quiet { color:var(--muted); font-size:.95rem; }

  /* --- helm: a grid of tiles from a layout document ---------------------------------
     Tile height follows the tile width (so a tile keeps its shape when the column count
     changes) but is capped so the default page fills a tablet without scrolling: three
     rows in landscape, four in portrait, where tiles are allowed to stand taller.      */
  .grid {
    --tw:calc((min(100vw, 1480px) - 2 * var(--side) - (var(--cols) - 1) * var(--gap)) / var(--cols));
    --row:clamp(150px, min(calc((100vh - var(--top) - var(--dock) - (var(--rows) + 1) * var(--gap)) / var(--rows)),
                            calc(var(--tw) * var(--ratio))), 260px);
    --row:clamp(150px, min(calc((100dvh - var(--top) - var(--dock) - (var(--rows) + 1) * var(--gap)) / var(--rows)),
                            calc(var(--tw) * var(--ratio))), 260px);
    display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows:var(--row); gap:var(--gap); grid-auto-flow:dense;
  }
  .tile { background:var(--panel); border:2px solid var(--rule); border-radius:16px;
          padding:12px 18px 12px; position:relative; overflow:hidden; min-width:0;
          display:flex; flex-direction:column; }
  .tile.M { grid-column:span 2; }
  .tile.L { grid-column:span 2; grid-row:span 2; }
  .tlabel { font-size:1.15rem; font-weight:600; color:var(--ink-soft); line-height:1.2;
            display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
  .tvalue { margin-top:auto; line-height:1; white-space:nowrap; }
  .tile .num { font-size:var(--num-s); line-height:1; display:block; }
  .tile.M .num { font-size:var(--num-m); }
  .tile.L .num { font-size:var(--num-l); }
  .num .unit { font-size:.36em; font-weight:600; color:var(--muted); margin-left:.14em;
               letter-spacing:0; }
  .range { display:block; width:100%; height:6px; margin-top:10px; }
  .range .track { fill:var(--rule-soft); }
  .range .fill { fill:var(--water); }
  .twhy { margin-top:6px; font-size:1rem; color:var(--muted); line-height:1.25; min-height:1.25em;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .twhy .glyph { display:none; margin-right:.35em; }
  .tile.absent .num { color:var(--muted); font-weight:500; }
  .tile.absent .range .fill { display:none; }
  /* A verdict is colour AND a shape AND words, never colour alone. */
  .tile.warn { border-color:var(--rust); border-width:3px; }
  .tile.warn .range .fill { fill:var(--rust); }
  .tile.warn .twhy { color:var(--ink); font-weight:600; }
  .tile.warn .glyph { display:inline; color:var(--rust); }
  .tile.warn .glyph::before { content:"●"; }
  .tile.bad { border-color:var(--red); border-width:3px; background:var(--panel-bad); }
  .tile.bad .num { color:var(--red); }
  .tile.bad .range .fill { fill:var(--red); }
  .tile.bad .twhy { color:var(--ink); font-weight:700; }
  .tile.bad .glyph { display:inline; color:var(--red); }
  .tile.bad .glyph::before { content:"▲"; }

  .tile.compass { padding:10px 14px 12px; }
  .tile.compass .rose { flex:1 1 auto; min-height:0; width:100%; }
  .tile.compass .rose svg { display:block; width:100%; height:100%; }
  .bearings { display:grid; grid-template-columns:repeat(3, 1fr); gap:.5rem; flex:0 0 auto;
              border-top:1px solid var(--rule-soft); margin-top:.4rem; padding-top:.6rem; }
  .bearings .blab { font-size:.95rem; font-weight:600; }
  .tile .bearings .bval { font-size:calc(var(--num-s) * .62); line-height:1.05; }
  .bearings .bsub { font-size:.9rem; color:var(--muted); white-space:nowrap; overflow:hidden;
                    text-overflow:ellipsis; }
  .tile.compass.M { flex-direction:row; align-items:stretch; gap:1rem; }
  .tile.compass.M .rose { flex:0 0 auto; width:auto; }
  .tile.compass.M .rose svg { width:auto; height:100%; }
  .tile.compass.M .bearings { flex:1 1 auto; grid-template-columns:1fr; border-top:0;
                              margin:0; padding:0; align-content:center; }
  .tile.clock .num { font-weight:600; }
  .tile.missing .tlabel { color:var(--muted); }

  /* --- arranging: one obvious button, tiles you drag, a sheet for the rest ----------- */
  .grid.editing .tile { cursor:grab; touch-action:pan-y; user-select:none;
                        -webkit-user-select:none; -webkit-touch-callout:none; }
  .grid.editing .tile::after { content:attr(data-size); position:absolute; top:10px; right:12px;
    min-width:34px; height:34px; padding:0 .5rem; border-radius:10px; background:var(--ink);
    color:var(--panel); font-size:.95rem; font-weight:700; display:flex; align-items:center;
    justify-content:center; }
  .grid.editing .tile.picked { outline:4px solid var(--water); outline-offset:2px; }
  .tile.dragging { pointer-events:none; z-index:6; box-shadow:var(--lift); opacity:.96;
                   transform:scale(1.03); }
  .editbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
             margin:0 0 var(--gap); padding:10px 12px; border:2px solid var(--rule);
             border-radius:16px; background:var(--panel); }
  .editbar .word { font-weight:600; color:var(--muted); padding:0 .4rem; }
  .bt { min-height:56px; min-width:56px; padding:0 1rem; border-radius:12px;
        border:2px solid var(--rule); background:var(--panel); color:var(--ink);
        font-weight:600; font-size:1.05rem; cursor:pointer; white-space:nowrap; }
  .bt[aria-pressed="true"] { background:var(--ink); color:var(--panel); border-color:var(--ink); }
  .bt.arm { border-color:var(--red); color:var(--red); }
  .bt:disabled { opacity:.45; cursor:default; }
  .sheet { position:fixed; left:0; right:0; z-index:45; background:var(--bar);
           border-top:3px solid var(--rule); padding:12px var(--side) 14px; box-shadow:var(--lift);
           bottom:calc(var(--dock) + env(safe-area-inset-bottom)); }
  .sheet[hidden] { display:none; }
  .sheet .srow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .sheet .srow + .srow { margin-top:8px; }
  .sheet .title { font-weight:700; font-size:1.15rem; margin-right:.5rem; }
  .sheet .grow { flex:1 1 auto; }

  /* --- generic -------------------------------------------------------------------- */
  ul.rows { list-style:none; margin:0; padding:0; }
  ul.rows li { display:flex; justify-content:space-between; gap:1rem; padding:.55rem 0;
               border-top:1px solid var(--rule-soft); flex-wrap:wrap; }
  ul.rows li:first-child { border-top:0; }
  .len { color:var(--good); font-weight:600; }
  .lead { font-size:1.5rem; font-weight:600; letter-spacing:-.02em; line-height:1.25; }
  .lead .when { color:var(--good); }
  .lead.bad .when { color:var(--red); }

  .strip { display:flex; gap:2px; align-items:flex-end; height:80px; overflow-x:auto; }
  .barw { flex:0 0 9px; border-radius:2px 2px 0 0; position:relative; background:var(--rule-soft); }
  .barw .f { position:absolute; bottom:0; left:0; right:0; border-radius:2px 2px 0 0; }
  .ok{background:var(--good)} .mid{background:var(--rust)} .badf{background:var(--red)}
  .night { opacity:.34; }
  .ticks { display:flex; gap:2px; overflow-x:auto; font-size:.7rem; color:var(--muted); }
  .ticks span { flex:0 0 9px; text-align:center; }
  .ticks .day { color:var(--ink-soft); font-weight:700; white-space:nowrap; overflow:visible; }

  #map { height:min(62vh, 30rem); border-radius:12px; border:2px solid var(--rule-soft); }
  /* Leaflet's own chrome ships white and stays white. On the night chart that made the
     zoom buttons and the attribution strip the two brightest objects on the screen —
     brighter than the chart they sit on, which is the opposite of the point. The tiles
     are themed by filter; these are ours to colour, so they follow the palette.          */
  .leaflet-control-zoom a { width:56px !important; height:56px !important;
                            line-height:56px !important; font-size:26px !important;
                            background:var(--panel) !important; color:var(--ink) !important;
                            border-color:var(--rule-soft) !important; }
  .leaflet-control-zoom a:hover { background:var(--bar) !important; }
  .leaflet-bar, .leaflet-control-attribution { border-color:var(--rule-soft) !important;
                            box-shadow:none !important; }
  .leaflet-control-attribution { background:var(--panel) !important; color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--ink-soft) !important; }
  /* The Ukrainian flag Leaflet embeds in its own credit is a raster image and stays at
     full brightness; dim it with the strip rather than hide it. */
  .leaflet-control-attribution img { opacity:.55; }
  /* Dark charts, by inversion rather than by tinting.
     Tinting a light map does not darken it — brightness(.42) on a near-white tile still
     lands mid-grey, and sepia+saturate pushes it back up into a large, flat, glaring
     orange field. Measured on the OSM tiles this drew ~44% luminance at night, which is
     roughly a torch in the face of anyone who has been dark-adapted for an hour.
     Inverting first is what actually produces a dark chart: land and sea go dark, the
     labels go light, and the second hue-rotate puts the water back on the blue side.
     Scoped to .leaflet-tile-pane on purpose — the route line, the boat and the zoom
     buttons are ours, they are already palette-coloured, and inverting them turns a red
     boat marker cyan.                                                                   */
  :root[data-mode="dusk"] .leaflet-tile-pane {
    filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.94) saturate(.75); }
  :root[data-mode="night"] .leaflet-tile-pane {
    filter:invert(1) grayscale(1) brightness(.5) contrast(1.1)
           sepia(1) saturate(5) hue-rotate(-28deg) brightness(.85); }
  /* The seamark overlay is drawn on transparency, so inverting it would erase the buoys
     against the now-dark base. It gets dimmed and tinted instead, never inverted.        */
  :root[data-mode="night"] .leaflet-tile-pane .leaflet-layer:not(:first-child) {
    filter:none; opacity:.85; }
  button.act { min-height:56px; padding:0 1.1rem; border-radius:12px; font-size:1.05rem;
    font-weight:600; border:2px solid var(--rule); background:var(--panel); color:var(--ink);
    cursor:pointer; }
  .pick { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--good); border:1px solid var(--good); border-radius:999px;
    padding:.1rem .45rem; margin-left:.5rem; vertical-align:.1em; }
  /* the dial. Stroke widths are in viewBox units, so they scale with the tile. */
  .dialwrap { position:relative; flex:1; display:flex; align-items:center; justify-content:center;
    min-height:0; }
  .dial { width:100%; height:100%; max-height:100%; overflow:visible; }
  .dial .track { fill:none; stroke:var(--rule-soft); stroke-width:7; stroke-linecap:round; }
  .dial .band  { fill:none; stroke-width:7; stroke-linecap:butt; opacity:.85; }
  .dial .band.warn { stroke:var(--rust); }
  .dial .band.bad  { stroke:var(--red); }
  .dial .sweep { fill:none; stroke:var(--ink); stroke-width:7; stroke-linecap:round;
    opacity:.55; transition:d .25s linear; }
  /* transform-box matters here. A CSS transform on an SVG element resolves its origin
     against the element's own bounding box by default, not the viewBox — so "50px 50px"
     meant fifty units from the corner of the needle line, and the needle swung around a
     point out in space instead of the hub. view-box puts it back in the dial's own
     coordinates, where 50,50 is the centre. */
  .dial .needle { stroke:var(--ink); stroke-width:2.6; stroke-linecap:round;
    transform-box:view-box; transform-origin:50px 50px;
    transition:transform .25s cubic-bezier(.22,.8,.3,1); }
  .dial .hub { fill:var(--panel); stroke:var(--ink); stroke-width:2.2; }
  .hasnum .dial .hub { display:none; }
  .hasnum .dial .needle { stroke-width:2.2; }
  .tile.warn .dial .needle, .tile.warn .dial .sweep { stroke:var(--rust); }
  .tile.bad  .dial .needle, .tile.bad  .dial .sweep { stroke:var(--red); }

<script>
// ── The boat's identity ───────────────────────────────────────────────────────────────
// This file contains no boat facts. The name, the subtitle, the chart's home position and
// the About card are all fetched from /api/profile, which reads boat.toml. That is what
// lets this dashboard live in a public repository while describing your boat.
window.OB_HOME = [0, 0];
window.OB_BERTH_NAME = 'Berth';
window.OB_PROFILE = null;
(function () {
  var request = new XMLHttpRequest();
  try {
    request.open('GET', '/api/profile', false);   // before first paint: the chart needs it
    request.send(null);
    if (request.status === 200) {
      var p = JSON.parse(request.responseText);
      window.OB_PROFILE = p;
      window.OB_HOME = [p.berth.lat, p.berth.lon];
      window.OB_BERTH_NAME = p.berth.name || 'Berth';
    }
  } catch (e) { /* no profile: the page still runs, showing no boat rather than a wrong one */ }
})();
function obApplyProfile() {
  var p = window.OB_PROFILE;
  if (!p) return;
  var v = p.vessel || {};
  var name = v.name || 'OpenBoat';
  document.title = name;
  var h1 = document.getElementById('boatname');
  if (h1) h1.textContent = name;
  var sub = document.getElementById('sub');
  if (sub) {
    var bits = [];
    if (v.kind) bits.push(v.kind);
    if (v.length_m) bits.push(Number(v.length_m).toFixed(2).replace('.', ',') + ' m');
    if (p.berth && p.berth.name) bits.push(p.berth.name);
    sub.textContent = bits.join(' · ');
  }
  var boatRow = document.getElementById('about-boat');
  if (boatRow) {
    var dims = [];
    if (v.length_m) dims.push(Number(v.length_m).toFixed(2).replace('.', ',') + ' m');
    if (v.beam_m) dims.push(Number(v.beam_m).toFixed(2).replace('.', ',') + ' m beam');
    if (v.draft_m) dims.push('draft ' + Number(v.draft_m).toFixed(2).replace('.', ',') + ' m');
    boatRow.textContent = [name].concat(dims).join(' · ');
  }
  var engineRow = document.getElementById('about-engine');
  if (engineRow) {
    var e = [];
    if (v.engine_kw) e.push(Number(v.engine_kw).toFixed(0) + ' kW');
    if (v.engine_note) e.push(v.engine_note);
    engineRow.textContent = e.length ? e.join(' · ') : 'not recorded';
  }
  var un = document.getElementById('about-unsourced');
  if (un && p.unsourced && p.unsourced.length) {
    un.textContent = ' Unsourced right now: ' + p.unsourced.join(', ') + '.';
  }
}
// Alarm bands from the profile, keyed by the short metric name (engine_temperature,
// battery_voltage, ...). A band set there replaces whatever the SIGNALS table holds; a
// metric with no band anywhere gets no verdict, which is the honest state for an engine
// nobody has characterised yet.
function obApplyBands(signals) {
  var p = window.OB_PROFILE;
  if (!p || !p.bands || !signals) return;
  var byKey = {};
  for (var path in signals) {
    if (signals[path] && signals[path].key) byKey[signals[path].key] = signals[path];
  }
  var alias = { engine_temperature:'coolant_c', engine_oil_pressure:'oil_bar',
                battery_voltage:'volts', fuel_level:'fuel_pct', engine_revolutions:'rpm',
                depth:'depth_m', water_temperature:'water_c',
                speed_over_ground:'sog_kn', wind_speed:'wind_apparent_kn' };
  for (var name in p.bands) {
    var target = byKey[alias[name] || name];
    if (target) target.bands = p.bands[name];
  }
}
document.addEventListener('DOMContentLoaded', obApplyProfile);

/* Palette before first paint, so a night-time load never flashes white at the helm.
   Auto follows the sun's height over the boat — the berth when the boat is offline —
   not the clock: 3° and above is day, down to −6° (end of civil twilight) is dusk, below
   is night. Same low-precision solar formula as the Astronomical Almanac, good to ~0.01°. */
(function () {
  const KEY = 'openboat.mode.v1', HOME = (window.OB_HOME || [0, 0]);
  function solarElevation(date, lat, lon) {
    const rad = Math.PI / 180;
    const n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;      // days since J2000
    const L = (280.460 + 0.9856474 * n) % 360;
    const g = ((357.528 + 0.9856003 * n) % 360) * rad;
    const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
    const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
    const gmst = (18.697374558 + 24.06570982441908 * n) % 24;
    const ha = (gmst * 15 + lon) * rad - ra;
    return Math.asin(Math.sin(lat * rad) * Math.sin(dec) +
                     Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
  }
  function resolve(pref, lat, lon) {
    if (pref === 'day' || pref === 'dusk' || pref === 'night') return pref;
    const el = solarElevation(new Date(), lat ?? HOME[0], lon ?? HOME[1]);
    return el >= 3 ? 'day' : el >= -6 ? 'dusk' : 'night';
  }
  let pref = 'auto';
  try { pref = localStorage.getItem(KEY) || 'auto'; } catch (e) {}
  document.documentElement.dataset.mode = resolve(pref);
  window.Palette = { KEY, HOME, pref, resolve, solarElevation };
})();
</script>

<body>

<header class="top">
  <h1 id="boatname">OpenBoat</h1>
  <span class="sub" id="sub"></span>
  <div class="pages" id="pages" hidden></div>
  <span class="link" id="link" title="boat link">looking for the boat</span>
  <button class="tool" id="arrange" hidden aria-pressed="false" aria-label="Arrange the helm">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/>
      <circle cx="9" cy="7" r="2.2" fill="var(--panel)"/><circle cx="15" cy="12" r="2.2" fill="var(--panel)"/>
      <circle cx="8" cy="17" r="2.2" fill="var(--panel)"/></svg>
    <span class="word">Arrange</span>
  </button>
</header>

<main id="main"></main>

<div class="dock">
  <nav id="nav" role="tablist" aria-label="Apps"></nav>
  <button class="mode" id="mode" aria-label="Palette: tap for the next, hold for automatic"></button>
</div>

<div class="sheet" id="sheet" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

/* ── the shell ─────────────────────────────────────────────────────────────────────
   One poll loop, one state object, apps that register against it. An app renders from
   `state` and never fetches for itself, so eight open tabs cost one request, and every
   app sees the same boat at the same instant.                                        */

const OS = {
  apps: [],
  state: { boat: null, boatAt: 0, windows: null, forecast: null },
  current: null,

  app(def) { this.apps.push(def); },

  start() {
    const nav = document.getElementById('nav'), main = document.getElementById('main');
    this.apps.forEach(a => {
      const b = document.createElement('button');
      b.textContent = a.title; b.id = 'tab-' + a.id;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'app-' + a.id);
      b.onclick = () => this.show(a.id);
      nav.appendChild(b);
      const s = document.createElement('section');
      s.className = 'app'; s.id = 'app-' + a.id; s.hidden = true;
      s.setAttribute('role', 'tabpanel');
      main.appendChild(s);
      a.el = s;
    });

    const wanted = location.hash.slice(1) || localStorage.getItem('openboat.app');
    this.show(this.apps.some(a => a.id === wanted) ? wanted : this.apps[0].id);
    addEventListener('hashchange', () => this.show(location.hash.slice(1)));

    this.swipe(main);
    this.modeButton();
    this.pollBoat(); setInterval(() => this.pollBoat(), 2000);
    this.pollWeather(); setInterval(() => this.pollWeather(), 600000);
  },

  show(id) {
    const app = this.apps.find(a => a.id === id);
    if (!app || this.current === id) return;
    if (this.current === 'helm') Helm.stopEditing();
    this.current = id;
    try { localStorage.setItem('openboat.app', id); } catch (e) {}
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);

    this.apps.forEach(a => {
      a.el.hidden = a.id !== id;
      document.getElementById('tab-' + a.id).setAttribute('aria-selected', a.id === id);
    });
    document.getElementById('tab-' + id).scrollIntoView({ inline: 'center', block: 'nearest' });
    if (!app.ready) { app.mount?.(app.el); app.ready = true; }
    app.render?.(app.el, this.state);
    Helm.chrome(id === 'helm');
  },

  step(dir) {
    const i = this.apps.findIndex(a => a.id === this.current) + dir;
    if (i >= 0 && i < this.apps.length) this.show(this.apps[i].id);
  },

  // A horizontal swipe on the content moves one app along; vertical stays a scroll
  // (touch-action:pan-y on main). The map, the report frames and the wind strip own
  // their own horizontal gestures and are left alone.
  swipe(main) {
    let sx = 0, sy = 0, live = false;
    main.addEventListener('pointerdown', e => {
      live = false;
      if (e.pointerType !== 'touch' || Helm.editing) return;
      if (e.target.closest('#map, iframe, .strip, .ticks, [data-noswipe]')) return;
      sx = e.clientX; sy = e.clientY; live = true;
    });
    main.addEventListener('pointerup', e => {
      if (!live) return;
      live = false;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy)) this.step(dx < 0 ? 1 : -1);
    });
    main.addEventListener('pointercancel', () => { live = false; });
  },

  paint() {
    const app = this.apps.find(a => a.id === this.current);
    app?.render?.(app.el, this.state);
  },

  async pollBoat() {
    try {
      const r = await fetch('/api/state');
      const s = await r.json();
      this.state.boat = s.online ? s : null;
      this.state.reason = s.reason;
      if (s.online) this.state.boatAt = Date.now();
    } catch (e) { this.state.boat = null; }
    this.link(); this.mode(); this.paint();
  },

  async pollWeather() {
    try {
      const [w, f] = await Promise.all([
        fetch('/api/windows?days=7&min_hours=3').then(r => r.json()),
        fetch('/api/forecast?days=3').then(r => r.json())]);
      this.state.windows = w; this.state.forecast = f;
    } catch (e) {}
    this.paint();
  },

  link() {
    const el = document.getElementById('link'), b = this.state.boat;
    if (!b) { el.textContent = 'boat offline'; el.className = 'link'; el.title = 'boat offline'; return; }
    const age = (Date.now() - this.state.boatAt) / 1000;
    el.textContent = `${fmtNum(b.sog_kn, 1, '–')} kn · ${b.cog_deg ?? '–'}°`;
    el.title = el.textContent;
    el.className = 'link ' + (age > 10 ? 'stale' : 'on');
  },

  /* ── palette: auto by the sun over the boat, one tap to override, hold to go back ── */
  MODES: ['day', 'dusk', 'night'],
  GLYPH: {
    day: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/>' +
         '<path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
    dusk: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/>' +
          '<path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
    night: '<svg viewBox="0 0 24 24" aria-hidden="true">' +
           '<path d="M19 14.5A8 8 0 0 1 9.5 5a8 8 0 1 0 9.5 9.5z" fill="currentColor"/></svg>',
  },
  mode() {
    const b = this.state.boat;
    const shown = Palette.resolve(Palette.pref, b?.lat ?? null, b?.lon ?? null);
    if (document.documentElement.dataset.mode !== shown) document.documentElement.dataset.mode = shown;
    const btn = document.getElementById('mode');
    const name = shown[0].toUpperCase() + shown.slice(1);
    btn.innerHTML = this.GLYPH[shown] + `<span><b>${name}</b><small>${
      Palette.pref === 'auto' ? 'automatic' : 'hold for automatic'}</small></span>`;
  },
  setMode(pref) {
    Palette.pref = pref;
    try { pref === 'auto' ? localStorage.removeItem(Palette.KEY) : localStorage.setItem(Palette.KEY, pref); }
    catch (e) {}
    this.mode();
  },
  modeButton() {
    const btn = document.getElementById('mode');
    let held = null, long = false;
    btn.addEventListener('pointerdown', e => {
      long = false;
      held = setTimeout(() => { long = true; this.setMode('auto'); }, 550);
    });
    const release = () => { clearTimeout(held); held = null; };
    btn.addEventListener('pointerup', () => {
      if (held === null) return;
      release();
      if (long) return;
      const shown = document.documentElement.dataset.mode;
      this.setMode(this.MODES[(this.MODES.indexOf(shown) + 1) % this.MODES.length]);
    });
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault();
        const shown = document.documentElement.dataset.mode;
        this.setMode(this.MODES[(this.MODES.indexOf(shown) + 1) % this.MODES.length]); }
      if (e.key === 'Escape' || e.key === 'Backspace') this.setMode('auto');
    });
    this.mode();
    setInterval(() => this.mode(), 60000);      // the sun moves even when the boat is silent
  },
};

/* ── shared helpers ───────────────────────────────────────────────────────────────── */

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad = n => String(n).padStart(2, '0');
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmt = iso => { const d = new Date(iso);
  return `${DAYS[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)} ${hhmm(d)}`; };
const fmtNum = (v, dp, dash) => v === null || v === undefined ? (dash ?? '—') : v.toFixed(dp);
const POINTS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass = d => d === null || d === undefined ? '––' : POINTS[Math.round(d/22.5) % 16];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function empty(el, heading, body) {
  el.innerHTML = `<div class="card empty"><h3>${heading}</h3><div class="quiet">${body}</div></div>`;
}

/* ── signals: what a tile can bind to ─────────────────────────────────────────────────
   Keyed by Signal K path so a layout document means the same thing on any boat; `key`
   is the field `/api/state` carries it in. Instance names (engine_1, house, main) are
   the ones arduino/xdr_bridge.py publishes. `bands` turn a value into a verdict; `why` puts
   the verdict into words, because a colour alone is not a verdict.

   Bands set in your boat profile override anything here — see obApplyBands below. */
const SIGNALS = {
  'navigation.speedOverGround': { key:'sog_kn', label:'Speed', unit:'kn', dp:1, max:40,
    why:() => 'over ground' },
  'environment.depth.belowTransducer': { key:'depth_m', label:'Depth', unit:'m', dp:1, max:50,
    bands:[[0,3,'bad'],[3,6,'warn']],
    why:v => v < 3 ? 'shoal — below the transducer' : v < 6 ? 'shelving' : 'below transducer' },
  'environment.wind.speedApparent': { key:'wind_apparent_kn', label:'Wind', unit:'kn', dp:1, max:40,
    extra:b => b.wind_apparent_deg === null || b.wind_apparent_deg === undefined ? 'apparent' :
      `apparent, ${Math.round(b.wind_apparent_deg)}° ${compass(b.wind_apparent_deg)}` },
  'propulsion.engine_1.revolutions': { key:'rpm', label:'Engine', unit:'rpm', dp:0, max:5000,
    bands:[[4600,9999,'warn']], why:v => v > 4600 ? 'over cruise' : '' },
  // ⚠️ NO DEFAULT BANDS on the engine readings, deliberately.
  //
  // What counts as hot depends entirely on the engine. A raw-water cooled engine runs a
  // thermostat near 60 °C; a freshwater-cooled one runs near 85 °C. Shipping the wrong pair
  // leaves the dashboard a calm green straight through a real overheat, which is worse than
  // showing nothing at all. So engine bands come from your profile's [bands] table or not
  // at all, and an unbanded tile shows the number with no verdict rather than false comfort.
  'propulsion.engine_1.temperature': { key:'coolant_c', label:'Coolant', unit:'°C', dp:1, max:120,
    why:() => '' },
  'propulsion.engine_1.oilPressure': { key:'oil_bar', label:'Oil pressure', unit:'bar', dp:2, max:6,
    why:() => '' },
  'electrical.batteries.house.voltage': { key:'volts', label:'Battery', unit:'V', dp:2, max:15,
    bands:[[0,11.9,'bad'],[11.9,12.4,'warn']],
    why:v => v > 13.2 ? 'charging' : v < 11.9 ? 'flat' : 'at rest' },
  'tanks.fuel.main.currentLevel': { key:'fuel_pct', label:'Fuel', unit:'%', dp:0, max:100,
    bands:[[0,15,'bad'],[15,30,'warn']], why:v => v < 30 ? 'getting low' : 'in the tank' },
  'environment.water.temperature': { key:'water_c', label:'Sea', unit:'°C', dp:1, max:35,
    why:() => 'at the transducer' },
  'environment.outside.temperature': { key:'air_c', label:'Air', unit:'°C', dp:1, max:45,
    why:() => 'outside' },
  'navigation.headingTrue': { key:'heading_deg', label:'Heading', unit:'°', dp:0, max:360,
    why:v => compass(v) },
  'navigation.courseOverGroundTrue': { key:'cog_deg', label:'Course', unit:'°', dp:0, max:360,
    why:v => `over ground, ${compass(v)}` },

  /* ── added after reading how Raymarine's LightHouse and Orca lay out an instrument page.
     Every path below was checked against the Signal K schemas rather than guessed, and
     every one of them will read "no sender" on a boat that has not got it — which is most
     boats, for most of these, and is the correct thing for it to say.                    */
  'navigation.speedThroughWater': { key:'stw_kn', label:'Through water', unit:'kn', dp:1, max:40,
    extra:b => b.sog_kn != null && b.stw_kn != null
      ? (Math.abs(b.sog_kn - b.stw_kn) < 0.3 ? 'no current to speak of'
         : `${Math.abs(b.sog_kn - b.stw_kn).toFixed(1)} kn of ${b.sog_kn > b.stw_kn ? 'help' : 'foul tide'}`)
      : 'log' },
  // The number a grounding actually depends on. Absent until the profile says how far the
  // sounder sits above the keel — it will not assume an offset.
  'environment.depth.belowKeel': { key:'depth_keel_m', label:'Under the keel', unit:'m', dp:1, max:50,
    bands:[[0,1,'bad'],[1,2.5,'warn']],
    why:v => v < 1 ? 'about to touch' : v < 2.5 ? 'thin' : 'clear' },
  'environment.wind.speedTrue': { key:'wind_true_kn', label:'True wind', unit:'kn', dp:1, max:40,
    extra:b => (b.wind_true_deg == null ? 'true'
      : `from ${Math.round(b.wind_true_deg)}° ${compass(b.wind_true_deg)}`)
      + (b.wind_true_derived ? ', derived' : '') },
  'steering.rudderAngle': { key:'rudder_deg', label:'Rudder', unit:'°', dp:0, max:45,
    why:v => Math.abs(v) < 2 ? 'amidships' : v > 0 ? 'to starboard' : 'to port' },
  'navigation.attitude.roll': { key:'roll_deg', label:'Heel', unit:'°', dp:0, max:45,
    why:v => Math.abs(v) < 2 ? 'upright' : v > 0 ? 'to starboard' : 'to port' },
  'navigation.trip.log': { key:'trip_log_nm', label:'Trip', unit:'nm', dp:1, max:200,
    why:() => 'since reset' },
  'propulsion.engine_1.runTime': { key:'engine_hours', label:'Hours', unit:'h', dp:1, max:5000,
    why:() => 'on the meter' },
  'propulsion.engine_1.engineLoad': { key:'engine_load_pct', label:'Load', unit:'%', dp:0, max:100,
    why:v => v > 85 ? 'working hard' : v < 20 ? 'light' : '' },
  'propulsion.engine_1.oilTemperature': { key:'oil_c', label:'Oil temp', unit:'°C', dp:0, max:140,
    why:() => '' },
  'propulsion.engine_1.exhaustTemperature': { key:'exhaust_c', label:'Exhaust', unit:'°C', dp:0, max:600,
    why:() => 'at the riser' },
  'propulsion.engine_1.fuel.rate': { key:'fuel_lph', label:'Burn', unit:'L/h', dp:1, max:120,
    extra:b => b.fuel_lph && b.sog_kn ? `${(b.sog_kn / b.fuel_lph).toFixed(2)} nm per litre` : 'now' },
  'electrical.batteries.house.current': { key:'amps', label:'Current', unit:'A', dp:1, max:200,
    why:v => v > 0.5 ? 'charging' : v < -0.5 ? 'drawing' : 'idle' },
  // Voltage is a poor proxy for charge under load. This is the real one, when a shunt exists.
  'electrical.batteries.house.capacity.stateOfCharge': { key:'soc_pct', label:'Charge', unit:'%',
    dp:0, max:100, bands:[[0,30,'bad'],[30,50,'warn']],
    why:v => v < 30 ? 'low' : v < 50 ? 'getting there' : 'house bank' },
  'tanks.freshWater.main.currentLevel': { key:'water_pct', label:'Water', unit:'%', dp:0, max:100,
    bands:[[0,15,'bad'],[15,30,'warn']], why:() => 'fresh' },
  'tanks.wasteWater.main.currentLevel': { key:'waste_pct', label:'Waste', unit:'%', dp:0, max:100,
    bands:[[85,100,'bad'],[70,85,'warn']], why:() => 'holding tank' },
  'environment.outside.pressure': { key:'pressure_hpa', label:'Pressure', unit:'hPa', dp:0, max:1050,
    why:v => v < 1000 ? 'low' : v > 1020 ? 'high' : '' },
};

/* ── preconfigured pages ──────────────────────────────────────────────────────────────
   Five pages, each a situation rather than a category. Modelled on what Raymarine's
   LightHouse and Orca actually ship, then adapted: their pages assume a sailing yacht with
   a full sensor suite, and most of these tiles will read "no sender" on most boats. That
   is deliberate and it is why they are presets rather than defaults — you add the one that
   matches how you use the boat, and delete the tiles your boat cannot fill.

   Night passage is the one worth explaining. It has fewer tiles than the others, and
   bigger ones, on purpose: at night the instrument you need is the one you can read
   without focusing, and the answer to "what else could we show" is almost always nothing.
   Engine and battery detail are deliberately absent — that is what the Engine page is for,
   and a glance at it is a decision, not an ambient state.                               */
const PRESETS = {

/* ── the layout document ───────────────────────────────────────────────────────────
   Plain JSON, one per device class, versioned, nothing in it is DOM state. This is the
   thing that will sync between devices later and the thing the AI layer writes when
   asked "show me depth, engine temp and the anchor circle, big".

   { schema:"openboat.layout/1", id, device:"tablet"|"phone", rev, updated,
     pages:[{ id, name, tiles:[{ id, widget, bind, size:"S"|"M"|"L", hidden, options }] }] }

   `bind` is a Signal K path, or for a widget that needs several, an object of them.  */
const Layout = {
  KEY: 'openboat.layout.v1', SCHEMA: 'openboat.layout/1',
  device() { return matchMedia('(max-width:599px)').matches ? 'phone' : 'tablet'; },

  defaults(device) {
    const t = (id, widget, bind, size, extra = {}) =>
      ({ id, widget, bind, size, hidden: false, options: {}, ...extra });
    const rose = () => t('rose', 'compass', { heading: 'navigation.headingTrue',
      cog: 'navigation.courseOverGroundTrue', wind: 'environment.wind.directionTrue' }, 'L');
    return {
      schema: this.SCHEMA, id: `openboat-${device}`, device, rev: 1,
      updated: new Date().toISOString(),
      pages: [
        { id: 'helm', name: 'Helm', tiles: [
          rose(),
          t('sog', 'numeral', 'navigation.speedOverGround', 'S'),
          t('depth', 'numeral', 'environment.depth.belowTransducer', 'S'),
          t('wind', 'numeral', 'environment.wind.speedApparent', 'S'),
          t('rpm', 'numeral', 'propulsion.engine_1.revolutions', 'S'),
          t('coolant', 'numeral', 'propulsion.engine_1.temperature', 'S'),
          t('oil', 'numeral', 'propulsion.engine_1.oilPressure', 'S'),
          t('volts', 'numeral', 'electrical.batteries.house.voltage', 'S'),
          t('fuel', 'numeral', 'tanks.fuel.main.currentLevel', 'S'),
          t('sea', 'numeral', 'environment.water.temperature', 'S', { hidden: device !== 'phone' }),
          t('clock', 'clock', null, 'S', { hidden: true }),
        ] },
        { id: 'engine', name: 'Engine', tiles: [
          t('rpm', 'numeral', 'propulsion.engine_1.revolutions', 'L'),
          t('coolant', 'numeral', 'propulsion.engine_1.temperature', 'M'),
          t('oil', 'numeral', 'propulsion.engine_1.oilPressure', 'M'),
          t('volts', 'numeral', 'electrical.batteries.house.voltage', 'S'),
          t('fuel', 'numeral', 'tanks.fuel.main.currentLevel', 'S'),
          t('sea', 'numeral', 'environment.water.temperature', 'S'),
          t('clock', 'clock', null, 'S'),
        ] },
      ],
    };
  },

  load() {
    const device = this.device();
    try {
      const raw = localStorage.getItem(`${this.KEY}.${device}`);
      if (raw) {
        const doc = JSON.parse(raw);
        if (doc.schema === this.SCHEMA && Array.isArray(doc.pages) && doc.pages.length) return doc;
      }
    } catch (e) {}
    return this.defaults(device);
  },

  save(doc) {
    doc.rev = (doc.rev || 0) + 1;
    doc.updated = new Date().toISOString();
    try { localStorage.setItem(`${this.KEY}.${doc.device}`, JSON.stringify(doc)); } catch (e) {}
    if (Helm.editing) console.log('[openboat.layout] ' + JSON.stringify(doc));
  },

  reset() {
    const device = this.device();
    try { localStorage.removeItem(`${this.KEY}.${device}`); } catch (e) {}
    const doc = this.defaults(device);
    console.log('[openboat.layout] reset ' + JSON.stringify(doc));
    return doc;
  },
};

/* ── widgets: how a tile draws itself ──────────────────────────────────────────────
   build(tile) returns a node with an `_update(state)` that writes into it — the DOM is
   made once per layout and only the numbers move, so a drag is never interrupted by a
   re-render and nothing flickers every two seconds.                                 */

function bindLabel(tile) {
  const sig = typeof tile.bind === 'string' ? SIGNALS[tile.bind] : null;
  return tile.options?.label || sig?.label || WIDGETS[tile.widget]?.label ||
         (typeof tile.bind === 'string' ? tile.bind : tile.id);
}

/* ── one place where a tile's settings are resolved ───────────────────────────────────
   A signal knows what it usually is — a range, a unit, how many decimals are worth
   reading. A boat knows better. Coolant on a raw-water engine tops out around 60 °C and on
   a freshwater one around 85, and the same is true of every range in SIGNALS: they are
   sensible starting points, not truths.

   So every widget reads through here, and anything in the tile's own `options` wins. The
   ranges and the alarm bands you set on your own boat are yours; nothing overwrites them,
   and nothing here invents one you did not ask for — a tile with no bands shows the number
   with no verdict, which is the honest thing when nobody has said what hot means.        */
function cfg(tile, sig) {
  const o = tile.options || {};
  return {
    label: o.label || (sig ? sig.label : bindLabel(tile)),
    unit:  o.unit  !== undefined ? o.unit : (sig ? sig.unit : ''),
    dp:    o.dp    !== undefined ? +o.dp  : (sig ? sig.dp : 1),
    min:   o.min   !== undefined ? +o.min : 0,
    max:   o.max   !== undefined ? +o.max : (sig ? sig.max : 100),
    bands: Array.isArray(o.bands) ? o.bands : (sig && sig.bands ? sig.bands : []),
    sig,
  };
}

function bandClass(bands, value) {
  let cls = '';
  for (const [lo, hi, c] of bands || []) if (value >= lo && value < hi) cls = c;
  return cls;
}

/* ── the dial ─────────────────────────────────────────────────────────────────────────
   A needle exists for one reason a number cannot manage: it shows where a reading sits in
   its range without being read. Glancing at an engine gauge and seeing the needle further
   round than it was an hour ago is a different act from reading 86 and remembering 82.

   270° of sweep, opening at the bottom, which is the convention every engine gauge on
   every dashboard has used for a century — the reason to follow it is that people already
   know how to read it. Alarm bands are painted onto the arc itself, so the redline is a
   place on the dial rather than a colour the number turns after it is too late.          */
const SWEEP = 270, START = 135, R = 39;

function polar(t) {
  const a = (START + t * SWEEP) * Math.PI / 180;
  return [50 + R * Math.cos(a), 50 + R * Math.sin(a)];
}

function arcPath(t0, t1) {
  const [x0, y0] = polar(Math.max(0, Math.min(1, t0)));
  const [x1, y1] = polar(Math.max(0, Math.min(1, t1)));
  const large = (t1 - t0) * SWEEP > 180 ? 1 : 0;
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

function dialWidget(withNumber) {
  return {
    sizes: ['S', 'M', 'L'],
    build(tile) {
      const sig = typeof tile.bind === 'string' ? SIGNALS[tile.bind] : null;
      const c = cfg(tile, sig);
      const span = (c.max - c.min) || 1;
      const at = v => (v - c.min) / span;

      // Bands are painted once, at build: they do not change while the boat is running.
      const painted = (c.bands || []).map(([lo, hi, cls]) =>
        `<path class="band ${cls}" d="${arcPath(at(lo), at(hi))}"/>`).join('');

      const node = document.createElement('div');
      if (withNumber) node.classList.add('hasnum');
      node.innerHTML = `<div class="tlabel"><span>${c.label}</span></div>
        <div class="dialwrap">
          <svg class="dial" viewBox="0 0 100 100" aria-hidden="true">
            <path class="track" d="${arcPath(0, 1)}"/>
            ${painted}
            <path class="sweep" d=""/>
            <line class="needle" x1="50" y1="50" x2="50" y2="14"/>
            <circle class="hub" cx="50" cy="50" r="4.5"/>
          </svg>
          ${withNumber ? `<div class="dialnum"><span class="v">—</span><span class="unit"></span></div>` : ''}
        </div>
        <div class="twhy"><span class="txt"></span></div>`;

      const needle = node.querySelector('.needle'), sweep = node.querySelector('.sweep');
      const v = node.querySelector('.v'), unit = node.querySelector('.unit');
      const why = node.querySelector('.txt');

      node._update = st => {
        const b = st.boat, value = sig && b ? b[sig.key] : null;
        node.classList.remove('warn', 'bad');
        if (value === null || value === undefined) {
          node.classList.add('absent');
          needle.setAttribute('transform', `rotate(${START + 90} 50 50)`);
          sweep.setAttribute('d', '');
          if (v) { v.textContent = '—'; unit.textContent = ''; }
          why.textContent = sig ? 'no sender' : 'unknown signal';
          return;
        }
        node.classList.remove('absent');
        const cls = bandClass(c.bands, value);
        if (cls) node.classList.add(cls);
        const t = Math.max(0, Math.min(1, at(value)));
        needle.setAttribute('transform', `rotate(${START + 90 + t * SWEEP} 50 50)`);
        sweep.setAttribute('d', arcPath(0, t));
        if (v) { v.textContent = value.toFixed(c.dp); unit.textContent = c.unit; }
        why.textContent = (sig && sig.extra) ? sig.extra(b)
                        : (sig && sig.why ? sig.why(value) : '') || ' ';
      };
      return node;
    },
  };
}

const WIDGETS = {
  dial: dialWidget(false),
  gauge: dialWidget(true),
  numeral: {
    sizes: ['S', 'M', 'L'],
    build(tile) {
      const sig = typeof tile.bind === 'string' ? SIGNALS[tile.bind] : null;
      const node = document.createElement('div');
      node.innerHTML = `<div class="tlabel"><span></span></div>
        <div class="tvalue"><span class="num"><span class="v">—</span><span class="unit"></span></span></div>
        <svg class="range" viewBox="0 0 100 6" preserveAspectRatio="none" aria-hidden="true">
          <rect class="track" x="0" y="1" width="100" height="4" rx="2"/>
          <rect class="fill" x="0" y="1" width="0" height="4" rx="2"/></svg>
        <div class="twhy"><span class="glyph" aria-hidden="true"></span><span class="txt"></span></div>`;
      const c = cfg(tile, sig);
      node.querySelector('.tlabel span').textContent = c.label;
      const v = node.querySelector('.v'), unit = node.querySelector('.unit'),
            fill = node.querySelector('.fill'), why = node.querySelector('.txt');
      node._update = st => {
        const b = st.boat, value = sig && b ? b[sig.key] : null;
        node.classList.remove('warn', 'bad');
        if (value === null || value === undefined) {
          node.classList.add('absent');
          v.textContent = '—'; unit.textContent = '';
          fill.setAttribute('width', 0);
          why.textContent = sig ? 'no sender' : 'unknown signal';
          return;
        }
        node.classList.remove('absent');
        const cls = bandClass(c.bands, value);
        if (cls) node.classList.add(cls);
        v.textContent = value.toFixed(c.dp); unit.textContent = c.unit;
        fill.setAttribute('width',
          Math.max(0, Math.min(1, (value - c.min) / ((c.max - c.min) || 1))) * 100);
        why.textContent = sig.extra ? sig.extra(b) : (sig.why ? sig.why(value) : '') || ' ';
      };
      return node;
    },
  },

  compass: {
    sizes: ['M', 'L'], label: 'Compass rose',
    build(tile) {
      const node = document.createElement('div');
      node.innerHTML = `<div class="rose"><svg viewBox="0 0 300 300" role="img" aria-label="Compass rose">
          <g class="static"></g><g class="live"></g></svg></div>
        <div class="bearings"></div>`;
      drawRoseStatic(node.querySelector('.static'));
      const live = node.querySelector('.live'), bearings = node.querySelector('.bearings');
      node._update = st => drawRoseLive(live, bearings, st.boat);
      return node;
    },
  },

  clock: {
    sizes: ['S', 'M'], label: 'Time',
    build() {
      const node = document.createElement('div');
      node.innerHTML = `<div class="tlabel"><span>Time</span></div>
        <div class="tvalue"><span class="num"><span class="v"></span></span></div>
        <div class="twhy"><span class="txt"></span></div>`;
      const v = node.querySelector('.v'), why = node.querySelector('.txt');
      node._update = () => {
        const d = new Date();
        v.textContent = hhmm(d);
        why.textContent = `${DAYS[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)} · local`;
      };
      return node;
    },
  },

  missing: {
    sizes: ['S', 'M', 'L'],
    build(tile) {
      const node = document.createElement('div');
      node.innerHTML = `<div class="tlabel"><span></span></div>
        <div class="tvalue"><span class="num"><span class="v">—</span></span></div>
        <div class="twhy"><span class="txt">no such widget in this build</span></div>`;
      node.querySelector('.tlabel span').textContent = `${esc(tile.widget)} · ${bindLabel(tile)}`;
      node.classList.add('absent');
      node._update = () => {};
      return node;
    },
  },
};

/* ── the rose ─────────────────────────────────────────────────────────────────────
   One analogue instrument, on purpose. Three directions — where the bow points, where
   the boat is actually going, and where the wind is from — only mean anything against
   each other. Everything else is a numeral, which is faster to read in sunlight.     */

function drawRoseStatic(g) {
  let s = '<circle cx="150" cy="150" r="132" stroke="var(--rule)" stroke-width="1.5"/>' +
          '<circle cx="150" cy="150" r="104" stroke="var(--rule-soft)"/>';
  for (let d = 0; d < 360; d += 5) {
    const major = d % 30 === 0, mid = d % 10 === 0;
    const len = major ? 14 : mid ? 8 : 5;
    const a = (d - 90) * Math.PI / 180;
    const r1 = 132, r2 = 132 - len;
    s += `<line x1="${150+r1*Math.cos(a)}" y1="${150+r1*Math.sin(a)}"
                x2="${150+r2*Math.cos(a)}" y2="${150+r2*Math.sin(a)}"
                stroke="${major ? 'var(--ink-soft)' : 'var(--rule)'}" stroke-width="${major?2:1.2}"/>`;
    if (major) {
      const rt = 132 - 27;
      const label = d === 0 ? 'N' : d === 90 ? 'E' : d === 180 ? 'S' : d === 270 ? 'W' : d;
      const cardinal = d % 90 === 0;
      s += `<text x="${150+rt*Math.cos(a)}" y="${150+rt*Math.sin(a)+5}" text-anchor="middle"
             class="num" style="font-size:${cardinal?16:12}px;font-weight:${cardinal?700:600};
             fill:${cardinal?'var(--ink)':'var(--ink-soft)'}">${label}</text>`;
    }
  }
  g.innerHTML = s;
}

function drawRoseLive(g, bearings, b) {
  const hdg = b?.heading_deg ?? null;
  const cog = b?.cog_deg ?? null;
  const wind = b?.wind_true_deg ?? b?.wind_apparent_deg ?? null;
  const windKn = b?.wind_true_kn ?? b?.wind_apparent_kn ?? null;
  let s = '';

  // Pointers ride the ring rather than crossing the middle. Lines through the centre look
  // like an instrument and read like a scribble: three of them meet exactly where the eye
  // wants to rest, and each one crosses the other two.
  const pointer = (deg, colour, filled) => `
    <g class="swing" transform="rotate(${deg} 150 150)">
      <polygon points="150,56 139,80 161,80"
               fill="${filled ? colour : 'var(--panel)'}" stroke="${colour}" stroke-width="3"/>
    </g>`;

  if (wind !== null) s += pointer(wind, 'var(--rust)', false);
  if (cog !== null) s += pointer(cog, 'var(--water)', true);

  // The hull sits in the middle at the size of a boat on a chart, pointing where the bow
  // points. Small enough that the dial stays a dial.
  if (hdg !== null) {
    s += `<g class="swing" transform="rotate(${hdg} 150 150)">
      <path d="M150 104 C161 124 165 143 165 163 L165 181 C165 187 159 190 150 190
               C141 190 135 187 135 181 L135 163 C135 143 139 124 150 104 Z"
            fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="150" y1="112" x2="150" y2="182" stroke="var(--ink)" stroke-width="1.5"
            opacity=".4"/>
    </g>`;
  } else {
    s += `<circle cx="150" cy="150" r="6" stroke="var(--muted)" stroke-width="1.5"
                  stroke-dasharray="3 4"/>`;
  }
  g.innerHTML = s;

  const box = (label, value, sub, colour) => `
    <div><div class="blab" style="color:${colour}">${label}</div>
      <div class="bval num">${value}</div><div class="bsub">${sub}</div></div>`;
  const deg = v => v === null ? '–––' : String(Math.round(v)).padStart(3, '0') + '°';

  bearings.innerHTML =
    box('Bow', deg(hdg), hdg === null ? 'no compass' : compass(hdg), 'var(--ink-soft)') +
    box('Made good', deg(cog), cog === null ? 'no fix' : compass(cog), 'var(--water)') +
    box('Wind from', deg(wind),
        windKn === null ? 'no sender' : `${windKn.toFixed(1)} kn ${compass(wind)}`,
        'var(--rust)');
}

/* ── app: helm ─────────────────────────────────────────────────────────────────────
   Renders the layout document. Arrange mode: drag a tile to move it, tap it for size,
   hide and order; hidden tiles wait in the bar above the grid. Every change is saved
   as the document and printed to the console, so what syncs later is what you see. */

const Helm = {
  doc: null, page: 0, editing: false, picked: null, nodes: new Map(),
  el: null, grid: null, editbar: null, sheet: null, resetArmed: 0,

  mount(el) {
    this.el = el;
    el.innerHTML = `<div class="editbar" id="editbar" hidden></div><div class="grid" id="grid"></div>`;
    this.grid = el.querySelector('#grid');
    this.editbar = el.querySelector('#editbar');
    this.sheet = document.getElementById('sheet');
    this.doc = Layout.load();
    this.build();
    this.drag();
    document.getElementById('arrange').onclick = () => this.editing ? this.stopEditing() : this.startEditing();
    matchMedia('(max-width:599px)').addEventListener('change', () => {
      this.stopEditing(); this.doc = Layout.load(); this.page = 0; this.build();
    });
  },

  render(st) { for (const node of this.nodes.values()) node._update(st); },

  current() { return this.doc.pages[Math.min(this.page, this.doc.pages.length - 1)]; },

  build() {
    const page = this.current();
    this.grid.innerHTML = ''; this.nodes.clear();
    this.grid.classList.toggle('editing', this.editing);
    for (const tile of page.tiles) {
      if (tile.hidden) continue;
      const w = WIDGETS[tile.widget] || WIDGETS.missing;
      const size = w.sizes.includes(tile.size) ? tile.size : w.sizes[0];
      const node = w.build(tile);
      node.className = `tile ${WIDGETS[tile.widget] ? tile.widget : 'missing'} ${size}`;
      node.dataset.id = tile.id; node.dataset.size = size;
      node.setAttribute('role', this.editing ? 'button' : 'group');
      node.setAttribute('aria-label', bindLabel(tile));
      if (this.editing) { node.tabIndex = 0; node.classList.toggle('picked', tile.id === this.picked); }
      this.grid.appendChild(node);
      this.nodes.set(tile.id, node);
    }
    this.render(OS.state);
    this.pages();
    this.bar();
    if (this.picked && !this.sheet.hidden) this.openSheet(this.picked);
  },

  chrome(onHelm) {
    document.getElementById('arrange').hidden = !onHelm;
    document.getElementById('pages').hidden = !onHelm || !this.doc || (this.doc.pages.length < 2 && !this.editing);
    document.getElementById('sub').hidden = onHelm && this.doc && (this.doc.pages.length > 1 || this.editing);
  },

  pages() {
    const box = document.getElementById('pages');
    box.innerHTML = '';
    this.doc.pages.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = p.name;
      b.setAttribute('aria-pressed', i === this.page);
      b.onclick = () => { this.page = i; this.picked = null; this.closeSheet(); this.build(); };
      box.appendChild(b);
    });
    this.chrome(OS.current === 'helm');
  },

  startEditing() {
    this.editing = true;
    const btn = document.getElementById('arrange');
    btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
    btn.querySelector('.word').textContent = 'Done';
    console.log('[openboat.layout] ' + JSON.stringify(this.doc));
    this.build();
  },

  stopEditing() {
    if (!this.editing) return;
    this.editing = false; this.picked = null; this.closeSheet();
    const btn = document.getElementById('arrange');
    btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false');
    btn.querySelector('.word').textContent = 'Arrange';
    this.build();
  },

  bar() {
    const bar = this.editbar;
    bar.hidden = !this.editing;
    if (!this.editing) return;
    const page = this.current();
    bar.innerHTML = '';
    const add = (label, fn, cls = 'bt') => {
      const b = document.createElement('button'); b.className = cls; b.textContent = label;
      b.onclick = fn; bar.appendChild(b); return b;
    };
    const word = t => { const s = document.createElement('span'); s.className = 'word';
      s.textContent = t; bar.appendChild(s); };
    const hidden = page.tiles.filter(t => t.hidden);
    word(hidden.length ? 'Show' : 'Every tile is on the page');
    hidden.forEach(t => add(bindLabel(t), () => { t.hidden = false; this.commit(); }));
    word('·');
    add('Add tile', () => this.addTile());
    add('Add page', () => {
      const name = prompt('Name for the new page', 'Page ' + (this.doc.pages.length + 1));
      if (!name) return;
      this.doc.pages.push({ id: 'p' + Date.now().toString(36), name: name.trim(), tiles: [] });
      this.page = this.doc.pages.length - 1; this.commit();
    });
    // Preset pages. Offered rather than shipped: most of these tiles need a sender most
    // boats do not have, so a preset that arrived as a default would be a page of "no
    // sender" on first run. Added on request, it is a starting point you then delete from.
    word('Preset pages');
    Object.entries(PRESETS).forEach(([key, preset]) => add(preset.name, () => {
      this.doc.pages.push({
        id: 'p' + key + Date.now().toString(36), name: preset.name,
        tiles: preset.tiles.map(([id, kind, path, size]) => ({
          id: id + '-' + Math.random().toString(36).slice(2, 6),
          widget: kind, size, hidden: false, options: {},
          // The compass takes three bindings rather than one — it exists to show heading,
          // course and wind against each other, which is the only way any of the three
          // means anything.
          bind: kind === 'compass'
            ? { heading: 'navigation.headingTrue',
                cog: 'navigation.courseOverGroundTrue',
                wind: 'environment.wind.directionTrue' }
            : path,
        })),
      });
      this.page = this.doc.pages.length - 1; this.commit();
    }));
    word('·');
    add('Rename page', () => {
      const name = prompt('Page name', page.name);
      if (name && name.trim()) { page.name = name.trim(); this.commit(); }
    });
    const del = add('Delete page', () => {
      if (this.doc.pages.length < 2) return;
      this.doc.pages.splice(this.page, 1); this.page = 0; this.commit();
    });
    del.disabled = this.doc.pages.length < 2;
    const reset = add(this.resetArmed > Date.now() ? 'Tap again to reset' : 'Reset layout', () => {
      if (this.resetArmed > Date.now()) {
        this.resetArmed = 0; this.doc = Layout.reset(); this.page = 0; this.picked = null;
        this.closeSheet(); this.build();
      } else {
        this.resetArmed = Date.now() + 4000; this.bar();
        setTimeout(() => { if (this.editing && this.resetArmed <= Date.now()) this.bar(); }, 4200);
      }
    });
    if (this.resetArmed > Date.now()) reset.classList.add('arm');
  },

  addTile() {
    const page = this.current();
    const used = new Set(page.tiles.map(t => typeof t.bind === 'string' ? t.bind : t.widget));
    const choices = Object.keys(SIGNALS).filter(p => !used.has(p));
    if (!page.tiles.some(t => t.widget === 'compass')) choices.unshift('compass');
    if (!page.tiles.some(t => t.widget === 'clock')) choices.unshift('clock');
    const sheet = this.sheet;
    sheet.hidden = false;
    sheet.innerHTML = `<div class="srow"><span class="title">Add a tile</span><span class="grow"></span>
      <button class="bt" id="s-close">Close</button></div><div class="srow" id="s-choices"></div>`;
    const row = sheet.querySelector('#s-choices');
    if (!choices.length) row.innerHTML = '<span class="word">Every signal is already on this page</span>';
    choices.forEach(p => {
      const b = document.createElement('button'); b.className = 'bt';
      b.textContent = p === 'compass' ? 'Compass rose' : p === 'clock' ? 'Time' : SIGNALS[p].label;
      b.onclick = () => {
        const id = (p === 'compass' || p === 'clock' ? p : SIGNALS[p].key) + '-' + Date.now().toString(36);
        const tile = p === 'compass'
          ? { id, widget: 'compass', size: 'L', hidden: false, options: {}, bind: { heading: 'navigation.headingTrue',
              cog: 'navigation.courseOverGroundTrue', wind: 'environment.wind.directionTrue' } }
          : p === 'clock' ? { id, widget: 'clock', bind: null, size: 'S', hidden: false, options: {} }
          : { id, widget: 'numeral', bind: p, size: 'S', hidden: false, options: {} };
        page.tiles.push(tile); this.picked = id; this.commit(); this.openSheet(id);
      };
      row.appendChild(b);
    });
    sheet.querySelector('#s-close').onclick = () => this.closeSheet();
    this.sheetOpen();
  },

  commit() { Layout.save(this.doc); this.build(); },

  openSheet(id) {
    const page = this.current(), tile = page.tiles.find(t => t.id === id);
    if (!tile) return this.closeSheet();
    this.picked = id;
    for (const [tid, node] of this.nodes) node.classList.toggle('picked', tid === id);
    const w = WIDGETS[tile.widget] || WIDGETS.missing;
    const visible = page.tiles.filter(t => !t.hidden), at = visible.indexOf(tile);
    const sheet = this.sheet;
    sheet.hidden = false;
    sheet.innerHTML = `<div class="srow"><span class="title">${esc(bindLabel(tile))}</span>
        <span class="word">Size</span>
        ${w.sizes.map(s => `<button class="bt" data-size="${s}" aria-pressed="${s === tile.size}">${s}</button>`).join('')}
        <span class="grow"></span><button class="bt" id="s-close">Close</button></div>
      <div class="srow"><button class="bt" id="s-earlier" ${at <= 0 ? 'disabled' : ''}>◀ Earlier</button>
        <button class="bt" id="s-later" ${at >= visible.length - 1 ? 'disabled' : ''}>Later ▶</button>
        <span class="grow"></span><button class="bt" id="s-hide">Hide</button>
        <button class="bt" id="s-remove">Remove</button></div>`;
    sheet.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
      tile.size = b.dataset.size; this.commit();
    });
    const swap = dir => {
      const other = visible[at + dir];
      const i = page.tiles.indexOf(tile), j = page.tiles.indexOf(other);
      page.tiles[i] = other; page.tiles[j] = tile; this.commit();
    };
    sheet.querySelector('#s-earlier').onclick = () => swap(-1);
    sheet.querySelector('#s-later').onclick = () => swap(1);
    sheet.querySelector('#s-hide').onclick = () => { tile.hidden = true; this.closeSheet(); this.commit(); };
    sheet.querySelector('#s-remove').onclick = () => {
      page.tiles.splice(page.tiles.indexOf(tile), 1); this.closeSheet(); this.commit();
    };
    sheet.querySelector('#s-close').onclick = () => this.closeSheet();
    this.sheetOpen();
  },

  closeSheet() {
    this.sheet.hidden = true; this.sheet.innerHTML = ''; this.picked = null;
    document.body.classList.remove('sheet-open');
    for (const node of this.nodes.values()) node.classList.remove('picked');
  },

  // The sheet covers the bottom of the grid; give the page that much more room to scroll.
  sheetOpen() {
    document.body.classList.add('sheet-open');
    document.body.style.setProperty('--sheet', (this.sheet.offsetHeight + 12) + 'px');
  },

  // Pointer events, so one code path serves a finger, a glove through a wet screen, and
  // a mouse. A quick tap opens the sheet. With a mouse the tile lifts as soon as it
  // moves; with a finger it lifts after a short hold, so a plain drag still scrolls the
  // page — the same rule as a phone's home screen. Once lifted, the tile follows the
  // pointer and the grid reflows around it; the lifted tile ignores pointer events, so
  // elementFromPoint sees the tile underneath.
  drag() {
    const grid = this.grid;
    let lifted = false;
    grid.addEventListener('touchmove', e => { if (lifted) e.preventDefault(); }, { passive: false });
    grid.addEventListener('contextmenu', e => { if (this.editing) e.preventDefault(); });
    grid.addEventListener('pointerdown', e => {
      if (!this.editing) return;
      const tile = e.target.closest('.tile');
      if (!tile || tile.parentNode !== grid) return;
      const touch = e.pointerType !== 'mouse';
      if (!touch) e.preventDefault();
      try { tile.setPointerCapture(e.pointerId); } catch (err) {}
      const start = { x: e.clientX, y: e.clientY };
      let moved = false, lastUnder = null, lastSwap = 0, timer = null, last = null, raf = 0;
      lifted = false;
      const lift = () => { lifted = true; tile.classList.add('dragging'); this.closeSheet(); };
      if (touch) timer = setTimeout(lift, 280);

      // Holding a lifted tile near the top or bottom edge scrolls the page under it, so a
      // tile can travel further than one screen on a phone.
      const edge = () => {
        raf = 0;
        if (!lifted || !last) return;
        const dock = document.querySelector('.dock').offsetHeight, zone = 48;
        const step = last.clientY < 64 + zone ? -10 : last.clientY > innerHeight - dock - zone ? 10 : 0;
        if (step) {
          const before = scrollY;
          scrollBy(0, step);
          const d = scrollY - before;
          if (d) { start.y -= d; move(last); }
        }
        raf = requestAnimationFrame(edge);
      };

      // Listeners live on the window, not the tile: moving the tile in the DOM releases
      // pointer capture, and a tile that stopped hearing its own pointerup would stay lifted.
      const move = ev => {
        if (ev.pointerId !== e.pointerId) return;
        let dx = ev.clientX - start.x, dy = ev.clientY - start.y;
        if (!lifted) {
          if (Math.hypot(dx, dy) < 10) return;
          if (touch) { clearTimeout(timer); return; }   // a scroll, not a drag
          lift();
        }
        moved = true;
        last = { pointerId: ev.pointerId, clientX: ev.clientX, clientY: ev.clientY };
        if (!raf) raf = requestAnimationFrame(edge);
        tile.style.transform = `translate(${dx}px, ${dy}px) scale(1.03)`;
        const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.tile');
        if (!under || under === tile || under.parentNode !== grid) return;
        if (under === lastUnder && Date.now() - lastSwap < 300) return;
        const kids = [...grid.children], from = kids.indexOf(tile), to = kids.indexOf(under);
        const before = tile.getBoundingClientRect();
        grid.insertBefore(tile, from < to ? under.nextSibling : under);
        const after = tile.getBoundingClientRect();
        start.x += after.left - before.left; start.y += after.top - before.top;
        dx = ev.clientX - start.x; dy = ev.clientY - start.y;
        tile.style.transform = `translate(${dx}px, ${dy}px) scale(1.03)`;
        lastUnder = under; lastSwap = Date.now();
      };
      const up = ev => {
        if (ev.pointerId !== e.pointerId) return;
        clearTimeout(timer); cancelAnimationFrame(raf); raf = 0; last = null;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        tile.classList.remove('dragging'); tile.style.transform = '';
        const wasLifted = lifted; lifted = false;
        if (!wasLifted) {
          if (ev.type === 'pointerup' && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 10)
            this.openSheet(tile.dataset.id);
          return;
        }
        if (!moved) return;
        const page = this.current();
        const order = [...grid.children].map(n => n.dataset.id);
        page.tiles.sort((a, b) => {
          const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
          return (ia < 0 ? order.length : ia) - (ib < 0 ? order.length : ib);
        });
        Layout.save(this.doc);
        this.bar();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
    grid.addEventListener('keydown', e => {
      if (!this.editing) return;
      const tile = e.target.closest('.tile');
      if (tile && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); this.openSheet(tile.dataset.id); }
    });
  },
};
