<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenBoat console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E1315'/%3E%3Cpath d='M14 44h36M20 44V20l24 12-24 12' stroke='%2300E3A1' stroke-width='4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="console/docs.css">
<link rel="stylesheet" href="console/tasks.css">
<style>
/* ── OpenBoat console ────────────────────────────────────────────────────────────────
   The workshop end of the boat, as opposed to the helm. `index.html` is built to be read
   in sunlight at arm's length with wet hands; this is built to be read at a desk with a
   keyboard, where the questions are "what does the manual say", "what is this boat owed"
   and "what did somebody photograph last week".

   Monospace throughout, and that is a decision rather than a style. Nearly everything on
   this page is a quantity, a file name, a line number or a timestamp — the things a
   proportional font makes harder to compare down a column. Tabular figures mean 9.8 and
   10.1 occupy the same width, so a column of hours can be scanned instead of read.

   It holds no fact about any boat. Every name, number and document on it arrives from the
   API at run time, which is what lets this file live in a public repository.            */

:root{
  --bg:#0e1315; --chrome:#11181a; --panel:#151c1f; --field:#212a2d;
  --row-hi:#1e272a; --rule:#222c30; --rule-soft:#1a2225;
  --ink:#e9efec; --mute:#8a9994; --dim:#5d6b67;
  --accent:#00e3a1; --accent-ink:#04231a; --accent-wash:rgba(0,227,161,.10);
  --warn:#f0b45e; --bad:#f4715c; --info:#79c0e8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"DejaVu Sans Mono",Consolas,monospace;
  --rail:56px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 13px/1.55 var(--mono); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent)}
svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#263034;border:3px solid var(--bg);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── shell ─────────────────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh;min-height:0}

.bar{display:flex;align-items:center;gap:0;height:58px;background:var(--chrome);
     border-bottom:1px solid var(--rule);padding-right:18px}
.hamb{width:var(--rail);height:58px;display:grid;place-items:center;color:var(--mute)}
.hamb:hover{color:var(--ink)}
.brand{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .n{color:var(--accent)}
.bar h1{margin:0 0 0 10px;font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.bar .vessel{margin-left:auto;display:flex;align-items:center;gap:14px;
             color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.bar .vessel b{color:var(--mute);font-weight:400}

.frame{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}
nav{background:var(--chrome);border-right:1px solid var(--rule);
    display:flex;flex-direction:column;padding-top:2px;overflow:hidden}
nav button{display:flex;align-items:center;gap:14px;height:52px;padding:0 17px;
           color:var(--dim);width:100%;flex:0 0 auto}
nav button svg{width:22px;height:22px;flex:0 0 auto}
nav button span{font-size:13px;opacity:0;transition:opacity .12s;white-space:nowrap}
nav button:hover{color:var(--ink);background:#161e21}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
nav button[aria-current="true"] svg{stroke-width:2.2}
body.wide{--rail:210px}
body.wide nav button span{opacity:1}
nav .spacer{flex:1}
nav .foot{color:var(--dim);font-size:11px;padding:0 17px 14px;white-space:nowrap;
          opacity:0;transition:opacity .12s}
body.wide nav .foot{opacity:1}

main{min-width:0;min-height:0;overflow:hidden;display:grid}

/* ── a view: toolbar, list, split detail ───────────────────────────────────────────── */
.view{display:grid;grid-template-rows:auto minmax(0,auto) minmax(0,1fr);
      gap:16px;padding:18px 20px;min-height:0;min-width:0}
.view.plain{grid-template-rows:minmax(0,1fr)}
.view.solo{grid-template-rows:minmax(0,1fr);padding:0}

.tools{display:flex;align-items:center;gap:12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:13px;height:48px;
        background:var(--field);border:1px solid transparent;border-radius:3px;padding:0 15px}
.search:focus-within{border-color:#33413f}
.search svg{width:19px;height:19px;flex:0 0 auto}
.search .filt{color:var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
.search input::placeholder{color:var(--dim)}
.search .go{color:var(--ink);opacity:.85}
.tools .act{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);
            border-radius:3px}
.tools .act:hover{background:var(--accent-wash)}
.tools .act svg{width:21px;height:21px}
.tools .seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.tools .seg button{padding:0 14px;height:44px;color:var(--mute);font-size:12px;
                   border-right:1px solid var(--rule)}
.tools .seg button:last-child{border-right:0}
.tools .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.listwrap{overflow:auto;min-height:0;max-height:52vh;border-bottom:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:var(--bg);text-align:left;
         font-size:12.5px;font-weight:700;color:var(--ink);padding:9px 13px;
         border-bottom:1px solid var(--rule);white-space:nowrap}
tbody td{padding:11px 13px;border-bottom:1px solid var(--rule-soft);color:var(--mute);
         font-size:12.5px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#161e21}
tbody tr[aria-selected="true"] td{background:var(--row-hi);color:var(--ink)}
td.k{color:var(--ink);white-space:nowrap}
td.w{color:var(--ink)}
td.num{text-align:right;white-space:nowrap;color:var(--ink)}
td.st{white-space:nowrap}
.trunc{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;
     vertical-align:1px;background:var(--dim)}
.ok .dot{background:var(--accent)} .ok{color:var(--accent)}
.warn .dot{background:var(--warn)} .warn{color:var(--warn)}
.bad .dot{background:var(--bad)}   .bad{color:var(--bad)}
.info .dot{background:var(--info)} .info{color:var(--info)}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--rule);border-radius:2px;
     font-size:11px;color:var(--dim);letter-spacing:.03em}

/* ── the split ─────────────────────────────────────────────────────────────────────── */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;min-height:0}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.pane{background:var(--panel);border:1px solid var(--rule);display:flex;flex-direction:column;
      min-height:0;min-width:0}
.pane .head{display:flex;align-items:center;gap:12px;padding:12px 15px;min-height:47px;
            flex:0 0 auto}
.pane .head b{font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;
              text-overflow:ellipsis;white-space:nowrap}
.pane .head .side{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.14em;
                  white-space:nowrap}
.pane .head .meta{color:var(--mute);font-size:12px;white-space:nowrap}
.tabs{display:flex;gap:22px;padding:0 15px;border-bottom:1px solid var(--rule);
      overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 0 8px;border-bottom:2px solid transparent;color:var(--mute);
             font-size:12.5px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs .right{margin-left:auto;display:flex;align-items:center;gap:11px;color:var(--mute);
             font-size:12px;padding:9px 0}
.body{overflow:auto;padding:13px 15px;min-height:0;flex:1 1 auto;
      font-size:12.5px;line-height:1.7}
.pane.full{grid-column:1/-1}
.empty{color:var(--dim);padding:22px 15px;font-size:12.5px;line-height:1.8}
.empty b{color:var(--mute);font-weight:400}

/* key/value, the shape a header table has */
table.kv{border-collapse:collapse;table-layout:auto}
table.kv th{background:none;position:static;padding:7px 0;border-bottom:1px solid var(--rule)}
table.kv td{border-bottom:1px solid var(--rule-soft);padding:9px 16px 9px 0;
            vertical-align:top;word-break:break-word}
table.kv td:first-child{color:var(--mute);width:34%;white-space:nowrap}
table.kv td:last-child{color:var(--ink);padding-right:0}

/* line-numbered text */
.code{font-size:12.5px;line-height:1.65}
.code .ln{display:flex;gap:16px}
.code .no{color:var(--dim);text-align:right;min-width:3.2ch;user-select:none;flex:0 0 auto}
.code .tx{white-space:pre-wrap;word-break:break-word;flex:1;min-width:0;color:var(--mute)}
.code .ln:target .tx,.code .ln.hit .tx{background:var(--accent-wash)}
.code .h{color:var(--ink);font-weight:700}
.code .q{color:var(--accent)}
.code .c{color:var(--warn)}
.code .u{color:#e08a5a;text-decoration:underline}
.code .g{color:var(--dim)}

/* ── overview ──────────────────────────────────────────────────────────────────────── */
.scroll{overflow:auto;min-height:0;padding-right:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--rule);padding:15px 16px 14px}
.tile b{display:block;font-size:33px;line-height:1.1;font-weight:700;color:var(--accent);
        letter-spacing:-.02em}
.tile b.q{color:var(--warn)} .tile b.z{color:var(--dim)}
.tile span{display:block;margin-top:7px;color:var(--mute);font-size:11.5px;letter-spacing:.05em}
.tile em{display:block;margin-top:4px;color:var(--dim);font-size:11px;font-style:normal}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;
      margin-top:16px}
.card{background:var(--panel);border:1px solid var(--rule)}
.card h2{margin:0;padding:12px 15px;font-size:13px;font-weight:700;
         border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.card h2 .side{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:.14em;
               font-weight:400}
.card ul{margin:0;padding:6px 0;list-style:none}
.card li{padding:10px 15px;border-bottom:1px solid var(--rule-soft)}
.card li:last-child{border-bottom:0}
.card li .t{display:block;color:var(--ink)}
.card li .s{display:block;margin-top:3px;color:var(--dim);font-size:11.5px;line-height:1.65}
.card p{margin:0;padding:14px 15px;color:var(--dim);line-height:1.75}

/* ── dashboards ────────────────────────────────────────────────────────────────────── */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px}
.app-card{background:var(--panel);border:1px solid var(--rule);padding:17px 17px 15px;
          text-align:left;display:flex;flex-direction:column;gap:9px;min-height:158px}
.app-card:hover{border-color:#33413f;background:#171f22}
.app-card .ic{color:var(--accent)}
.app-card .ic svg{width:24px;height:24px}
.app-card b{font-size:14px;color:var(--ink)}
.app-card p{margin:0;color:var(--mute);font-size:12px;line-height:1.7;flex:1}
.app-card .go{color:var(--accent);font-size:11.5px;letter-spacing:.1em}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.stage .head{display:flex;align-items:center;gap:14px;height:46px;padding:0 16px;
             background:var(--chrome);border-bottom:1px solid var(--rule)}
.stage .head b{font-size:13px}
.stage .head .path{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;
                   white-space:nowrap}
.stage .head a{margin-left:auto;font-size:11.5px;letter-spacing:.08em;white-space:nowrap}
.stage iframe{border:0;width:100%;height:100%;background:var(--bg)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:12px}

/* photographs filed with a snag */
.shots{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.shots a{display:block;width:132px;height:99px;border:1px solid var(--rule);overflow:hidden;
         background:#0b1012}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.shots .miss{display:grid;place-items:center;color:var(--dim);font-size:10.5px;
             text-align:center;padding:8px;line-height:1.5;height:100%}
</style>
</head>
<body>

<div class="app">

  <div class="bar">
    <button class="hamb" id="hamb" title="Wider sidebar" aria-label="Wider sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand"><span class="n">OpenBoat</span>://</span>
    <h1 id="title">Overview</h1>
    <div class="vessel"><b id="vname">…</b><span id="vver"></span></div>
  </div>

  <div class="frame">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>

</div>

<script>
"use strict";
/* ── the shape of the thing ──────────────────────────────────────────────────────────
   Five views, one list-plus-split layout, and no state that outlives a reload. The page
   asks the API on every switch rather than caching, for the same reason `knowledge.py`
   re-reads its files: these documents are edited by hand, often in the middle of the job
   being asked about, and a stale answer about a boat is worse than a slow one.

   Nothing here writes. The console is a reader; the write surfaces are the snag service
   on its own port and a keyboard.                                                     */

const $  = (s, r = document) => r.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t);
                            if (c) n.className = c;
                            if (txt !== undefined) n.textContent = txt;
                            return n; };

async function api(path) {
  const r = await fetch(path, { headers: { Accept: "application/json" } });
  const j = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
  return j;
}

/* Never innerHTML with anything that came off disk. Every code line is escaped first and
   the only markup added afterwards is the span colouring below, built from the escaped
   text — a manual containing a `<script>` is a manual, not an instruction. */
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const nf  = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString("en-GB");
const kb  = n => n < 1024 ? `${n} B`
               : n < 1048576 ? `${(n / 1024).toFixed(0)} kB`
               : `${(n / 1048576).toFixed(1)} MB`;

/* "3 days ago" beats an ISO string in a column you are scanning, but the exact stamp goes
   in the detail pane — an age is for comparing, a timestamp is for quoting. */
function ago(iso) {
  if (!iso) return "—";
  const then = new Date(iso.replace(" ", "T"));
  if (isNaN(then)) return iso;
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days < 0) return "in " + (-days) + " d";
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 60) return days + " d ago";
  if (days < 730) return Math.floor(days / 30) + " mo ago";
  return Math.floor(days / 365) + " y ago";
}

const ICON = {
  overview: "M12 3a9 9 0 100 18 9 9 0 000-18zm3.6 5.4l-2 5.2-5.2 2 2-5.2 5.2-2z",
  docs:     "M7 3h7l5 5v13H7zM14 3v5h5M10 13h7M10 17h7",
  tasks:    "M4 7l2 2 3.5-3.5M4 15l2 2 3.5-3.5M13 7h7M13 16h7",
  boards:   "M4 4h7v6H4zM13 4h7v10h-7zM4 13h7v7H4zM13 17h7v3h-7z",
  boat:     "M3 16h18l-2.5 5H5.5zM12 16V4l7 12M12 16H6l2-6h4",
};
const svg = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;

const VIEWS = [
  { id: "overview",  label: "Overview",   title: "Overview" },
  { id: "docs",      label: "Documents",  title: "Documents" },
  { id: "tasks",     label: "Tasks",      title: "Tasks" },
  { id: "boards",    label: "Dashboards", title: "Dashboards" },
  { id: "boat",      label: "Boat",       title: "The boat" },
];

const state = { view: "overview", sub: null, params: {}, q: "", docs: null, hits: null,
                sel: null, tasks: null, filter: "all", profile: null, stage: null, tab: {} };

/* ── chrome ──────────────────────────────────────────────────────────────────────── */
function drawNav() {
  const nav = $("#nav");
  nav.textContent = "";
  for (const v of VIEWS) {
    const b = el("button");
    b.innerHTML = svg(ICON[v.id]) + `<span>${v.label}</span>`;
    b.setAttribute("aria-current", state.view === v.id ? "true" : "false");
    b.title = v.label;
    b.onclick = () => go(v.id);
    nav.append(b);
  }
  nav.append(el("div", "spacer"));
  const foot = el("div", "foot", "read-only");
  nav.append(foot);
}

/* ── routing ──────────────────────────────────────────────────────────────────────
   One address per thing. The hash is `view`, `view/sub`, or either with `?k=v`:
     #docs                 the shelf          #docs?q=impeller        a search
     #docs/pump-7j.md      one document       #docs/pump-7j.md/L212   a line in it
     #tasks/<id>           one snag or service item
   `route()` parses that into state.view / state.sub / state.params, and `nav()` is the only
   way a view moves: it writes the hash, and the hashchange handler does the rest, so the
   browser's back button is the console's back button and every page has a URL. */
function route() {
  const raw = location.hash.slice(1);
  const [pathPart, query = ""] = raw.split("?");
  const [view, ...rest] = pathPart.split("/");
  const params = {};
  for (const [k, v] of new URLSearchParams(query)) params[k] = v;
  return { view: VIEWS.some(v => v.id === view) ? view : "overview",
           sub: rest.length ? decodeURIComponent(rest.join("/")) : null,
           params };
}

function href(view, sub, params) {
  let h = "#" + view;
  if (sub) h += "/" + encodeURIComponent(sub).replace(/%2F/g, "/");
  const qs = new URLSearchParams(params || {}).toString();
  return qs ? h + "?" + qs : h;
}

function nav(view, sub, params) {
  const target = href(view, sub, params);
  if (location.hash === target) return apply();
  location.hash = target;
}

function apply() {
  const r = route();
  const changed = r.view !== state.view;
  state.view = r.view;
  state.sub = r.sub;
  state.params = r.params;
  state.stage = null;
  if (changed) {
    // The search box is per view. Carrying a query across meant arriving at Tasks with a
    // manual's vocabulary typed into it and being told, correctly and uselessly, that
    // nothing matched.
    state.q = "";
    state.sel = null;
  }
  if (r.params.q !== undefined) state.q = r.params.q;
  drawNav();
  $("#title").textContent = (VIEWS.find(v => v.id === state.view) || {}).title || state.view;
  render();
}

function go(view) { nav(view); }

$("#hamb").onclick = () => document.body.classList.toggle("wide");
window.addEventListener("hashchange", apply);

/* ── shared furniture ────────────────────────────────────────────────────────────── */
function toolbar(placeholder, onInput, extras) {
  const wrap = el("div", "tools");
  const box  = el("div", "search");
  box.innerHTML =
    `<svg class="filt" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
  const input = el("input");
  input.type = "search";
  input.placeholder = placeholder;
  input.value = state.q;
  input.oninput = () => { state.q = input.value; onInput(input.value); };
  box.append(input);
  const go = el("span", "go");
  go.innerHTML =
    `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>`;
  box.append(go);
  wrap.append(box);
  (extras || []).forEach(n => wrap.append(n));
  const clear = el("button", "act");
  clear.title = "Clear";
  clear.innerHTML =
    `<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>`;
  clear.onclick = () => { state.q = ""; input.value = ""; onInput(""); };
  wrap.append(clear);
  setTimeout(() => input.focus(), 30);
  return wrap;
}

function table(cols, rows, onPick, selected) {
  const wrap = el("div", "listwrap");
  const t = el("table");
  const cg = el("colgroup");
  cols.forEach(c => { const col = el("col"); if (c.w) col.style.width = c.w; cg.append(col); });
  t.append(cg);
  const thead = el("thead"), tr = el("tr");
  cols.forEach(c => { const th = el("th", c.cls || "", c.label); tr.append(th); });
  thead.append(tr); t.append(thead);
  const tb = el("tbody");
  rows.forEach((row, i) => {
    const r = el("tr");
    r.setAttribute("aria-selected", selected === i ? "true" : "false");
    cols.forEach(c => {
      const td = el("td", c.cls || "");
      const v = c.get(row, i);
      if (v instanceof Node) td.append(v); else td.textContent = v;
      r.append(td);
    });
    r.onclick = () => onPick(row, i);
    tb.append(r);
  });
  t.append(tb);
  wrap.append(t);
  if (!rows.length) {
    wrap.append(el("div", "empty", "Nothing here."));
  }
  return wrap;
}

function statusCell(kind, text) {
  const s = el("span", kind);
  s.append(el("span", "dot"));
  s.append(document.createTextNode(text));
  return s;
}

function pane(title, sideLabel, meta) {
  const p = el("div", "pane");
  const head = el("div", "head");
  head.append(el("b", "", title));
  if (meta) head.append(el("span", "meta", meta));
  head.append(el("span", "side", sideLabel));
  p.append(head);
  return p;
}

function tabs(names, active, onPick, right) {
  const t = el("div", "tabs");
  names.forEach(n => {
    const b = el("button", "", n);
    b.setAttribute("aria-selected", n === active ? "true" : "false");
    b.onclick = () => onPick(n);
    t.append(b);
  });
  if (right) { const r = el("div", "right"); r.append(right); t.append(r); }
  return t;
}

function kv(pairs) {
  const t = el("table", "kv");
  const thead = el("thead");
  thead.innerHTML = "<tr><th>Key</th><th>Value</th></tr>";
  t.append(thead);
  const tb = el("tbody");
  pairs.forEach(([k, v]) => {
    if (v === undefined || v === null || v === "") return;
    const r = el("tr");
    r.append(el("td", "", k));
    const td = el("td");
    if (v instanceof Node) td.append(v); else td.textContent = String(v);
    r.append(td);
    tb.append(r);
  });
  t.append(tb);
  return t;
}

/* Markdown, coloured just enough to find your place in it. Not a renderer: the text stays
   exactly as it is on disk, line for line, because the line number is half the citation
   and reflowing a manual would break the thing that makes an answer checkable.

   Two things here are about a 150-page manual rather than about a note. Most lines carry
   no markup at all, so they are set with textContent and never go near the HTML parser —
   parsing seven thousand fragments one at a time is what made an operator's manual take
   the best part of a minute to open. And a document past MAX_LINES opens as a window
   around the line being cited, with the rest one click away: a citation points at a line,
   and everything above it can wait until somebody asks for it. */

const MAX_LINES = 2200;
const RICH = /https?:\/\/|`|\*\*|^\s{0,3}(?:#{1,6}\s|>)/;

function code(text, hitLine, whole) {
  const box = el("div", "code");
  const lines = String(text ?? "").split("\n");

  let from = 0, to = lines.length;
  if (!whole && lines.length > MAX_LINES) {
    const centre = hitLine ? hitLine - 1 : 0;
    to = Math.min(lines.length, Math.max(centre + Math.floor(MAX_LINES / 2), MAX_LINES));
    from = Math.max(0, to - MAX_LINES);
    const bar = el("div", "empty");
    bar.append(statusCell("info",
      `Showing lines ${nf(from + 1)}–${nf(to)} of ${nf(lines.length)}.`));
    const more = el("button");
    more.textContent = `Show the whole file ▸`;
    more.style.cssText = "color:var(--accent);margin-left:10px";
    more.onclick = () => box.replaceWith(code(text, hitLine, true));
    bar.append(more);
    box.append(bar);
  }

  const frag = document.createDocumentFragment();
  for (let i = from; i < to; i++) {
    const line = lines[i], n = i + 1;
    const row = el("div", "ln" + (hitLine && n === hitLine ? " hit" : ""));
    row.id = "L" + n;
    row.append(el("span", "no", String(n)));
    const tx = el("span", "tx");
    if (!RICH.test(line)) {
      tx.textContent = line;                       // the common case, and the fast one
    } else {
      let html = esc(line);
      if (/^\s{0,3}#{1,6}\s/.test(line))     html = `<span class="h">${html}</span>`;
      else if (/^\s{0,3}>/.test(line))       html = `<span class="g">${html}</span>`;
      html = html
        .replace(/(https?:\/\/[^\s&<]+)/g, '<span class="u">$1</span>')
        .replace(/(`[^`]+`)/g, '<span class="c">$1</span>')
        .replace(/(\*\*[^*]+\*\*)/g, '<span class="q">$1</span>');
      tx.innerHTML = html;
    }
    row.append(tx);
    frag.append(row);
  }
  box.append(frag);
  return box;
}

function mount(node) { const m = $("#main"); m.textContent = ""; m.append(node); }
