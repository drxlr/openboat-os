<!-- Bootstrap 5.3 and its icon font, vendored beside Leaflet (see vendor/README.md): the
     console works with no network, so nothing here is fetched from a CDN. -->

<script>
  /* Light by default — this page is read at a desk — and dark only when the system is,
     so a night-mode laptop is not blinding. Set before first paint to avoid a flash. */
  (function () {
    const dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
    const set = () => document.documentElement.setAttribute("data-bs-theme",
                                                            dark && dark.matches ? "dark" : "light");
    set();
    if (dark && dark.addEventListener) dark.addEventListener("change", set);
  })();
</script>
<style>
  /* ── OpenBoat console ────────────────────────────────────────────────────────────────
     Bootstrap does the work. What is below is only what Bootstrap cannot know: a slightly
     larger reading size, the sea-blue the helm page already uses, and the few widgets the
     views share (a numbered code block, the key/value table, a phone rule for low-priority
     columns). Everything else on the page is a stock Bootstrap component, on purpose: the
     console is read by somebody in a bad mood in February, and a stock component is one
     they have used a thousand times before.                                            */
  :root { --ob-nav-h: 57px; }
  :root, [data-bs-theme="light"] {
    --bs-body-font-size: 1.0625rem;
    --bs-body-line-height: 1.6;
    --ob-sea: #175E7E; --bs-primary: #175E7E; --bs-primary-rgb: 23, 94, 126;
    --bs-link-color: #175E7E;         --bs-link-color-rgb: 23, 94, 126;
    --bs-link-hover-color: #0F4A66;   --bs-link-hover-color-rgb: 15, 74, 102;
  }
  [data-bs-theme="dark"] {
    --ob-sea: #74BBD9; --bs-primary: #74BBD9; --bs-primary-rgb: 116, 187, 217;
    --bs-link-color: #74BBD9;         --bs-link-color-rgb: 116, 187, 217;
    --bs-link-hover-color: #9FD2E8;   --bs-link-hover-color-rgb: 159, 210, 232;
    /* In the dark the sea-blue is the light colour, so anything filled with it carries
       dark text. White on #74BBD9 is 2.1:1 — the label on every filled button and on the
       page you are actually on, unreadable at exactly the moment it matters. */
    --ob-on-sea: #0B1B22;
  }
  [data-bs-theme="dark"] .btn-primary {
    --bs-btn-color: var(--ob-on-sea); --bs-btn-hover-color: var(--ob-on-sea);
    --bs-btn-active-color: var(--ob-on-sea); --bs-btn-disabled-color: var(--ob-on-sea);
    --bs-btn-hover-bg: #9FD2E8; --bs-btn-hover-border-color: #9FD2E8;
    --bs-btn-active-bg: #9FD2E8; --bs-btn-active-border-color: #9FD2E8; }
  [data-bs-theme="dark"] .btn-outline-primary { --bs-btn-hover-color: var(--ob-on-sea);
    --bs-btn-active-color: var(--ob-on-sea); }
  [data-bs-theme="dark"] .nav-pills { --bs-nav-pills-link-active-color: var(--ob-on-sea); }
  [data-bs-theme="dark"] #sidebar .nav-link.active { color: var(--ob-on-sea); }
  body { min-height: 100vh; }
  .btn-primary { --bs-btn-bg: var(--ob-sea); --bs-btn-border-color: var(--ob-sea);
                 --bs-btn-hover-bg: #134D68; --bs-btn-hover-border-color: #134D68;
                 --bs-btn-active-bg: #0F4A66; --bs-btn-active-border-color: #0F4A66; }
  .btn-outline-primary { --bs-btn-color: var(--ob-sea); --bs-btn-border-color: var(--ob-sea);
                         --bs-btn-hover-bg: var(--ob-sea); --bs-btn-hover-border-color: var(--ob-sea);
                         --bs-btn-active-bg: var(--ob-sea); --bs-btn-active-border-color: var(--ob-sea);
                         --bs-btn-focus-shadow-rgb: var(--bs-link-color-rgb); }
  .btn-primary { --bs-btn-focus-shadow-rgb: var(--bs-link-color-rgb); }
  .text-primary { color: var(--ob-sea) !important; }
  .bg-primary { background-color: var(--ob-sea) !important; }
  .dropdown-menu { --bs-dropdown-link-active-bg: var(--ob-sea); }
  .nav-pills { --bs-nav-pills-link-active-bg: var(--ob-sea); }
  .form-control:focus, .form-select:focus { border-color: var(--ob-sea);
    box-shadow: 0 0 0 .25rem rgba(var(--bs-link-color-rgb), .25); }

  /* the frame */
  #sidebar { min-height: calc(100vh - var(--ob-nav-h)); }
  @media (min-width: 992px) {
    #sidebar { position: sticky; top: var(--ob-nav-h); height: calc(100vh - var(--ob-nav-h));
               overflow-y: auto; }
  }
  #sidebar .nav-link { color: var(--bs-body-color); padding: .55rem .9rem; border-radius: .5rem; }
  #sidebar .nav-link:hover { background: var(--bs-tertiary-bg); }
  #sidebar .nav-link.active { color: #fff; }
  #sidebar .nav-link .bi { width: 1.5rem; display: inline-block; }
  h1, h2, h3, h4 { letter-spacing: -.01em; }
  .card { --bs-card-border-color: var(--bs-border-color-translucent); }

  /* The bar reads left to right as one sentence: whose console, which boat, which page.
     Everything about the reader — their name, their boats, the way out — is behind the
     one control on the right, because an account is not a thing you look at, it is a
     thing you occasionally open. The boat's name was previously printed twice, once in
     the switcher and once at the far right, which is what made the row look assembled
     rather than designed. */
  nav.navbar { min-height: var(--ob-nav-h); --bs-navbar-padding-y: 0; }
  .ob-brand { font-size: 1.05rem; letter-spacing: -.01em; }
  .ob-brand .bi { font-size: 1.15rem; color: var(--ob-sea); }
  .ob-rule { width: 1px; height: 1.4rem; background: var(--bs-border-color);
             flex: 0 0 auto; }
  .ob-boat { font-weight: 600; }
  .ob-boat.dropdown-toggle { --bs-btn-padding-x: .5rem; --bs-btn-padding-y: .15rem;
                             --bs-btn-font-weight: 600; }
  .ob-crumb { font-size: .7rem; color: var(--bs-secondary-color); opacity: .7; }
  .ob-view { color: var(--bs-secondary-color); }
  nav.navbar kbd { background: var(--bs-tertiary-bg); color: var(--bs-secondary-color);
                   border: 1px solid var(--bs-border-color); border-radius: .25rem;
                   padding: 0 .3rem; font-size: .7rem; box-shadow: none; }
  .ob-me { --bs-btn-padding-x: .4rem; --bs-btn-padding-y: .2rem; }
  .ob-me::after { margin-left: .1rem; opacity: .6; }
  .ob-face { width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--ob-sea);
             color: #fff; font-size: .72rem; font-weight: 600; line-height: 1;
             display: inline-flex; align-items: center; justify-content: center;
             flex: 0 0 auto; }
  [data-bs-theme="dark"] .ob-face { color: var(--ob-on-sea); }
  .card-header { background: transparent; font-weight: 600; }
  .card-header .side { font-weight: 400; font-size: .8rem; text-transform: uppercase;
                       letter-spacing: .04em; color: var(--bs-secondary-color); }
  .table > :not(caption) > * > * { padding: .7rem .75rem; }
  .table th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em;
              color: var(--bs-secondary-color); font-weight: 600; border-bottom-width: 1px; }
  tr[role="button"] { cursor: pointer; }

  /* Highlights, once, for every view. A selected or hovered row is a tint of the sea-blue
     the links use, with a bar on its leading edge; a matched search term is a warm mark;
     the line a citation points at is the same blue tint. Nothing on this page highlights
     by going dark — a black bar across a light table is the one thing that cannot be read. */
  .table { --bs-table-hover-bg: rgba(var(--bs-link-color-rgb), .07);
           --bs-table-active-bg: rgba(var(--bs-link-color-rgb), .13);
           --bs-table-active-color: var(--bs-body-color); }
  /* Bootstrap paints a row's active tint as an inset shadow on every cell, so the bar on
     the first cell has to carry that tint along with it or the cell goes white. */
  .table > tbody > tr.table-active > td:first-child {
    box-shadow: inset 4px 0 var(--ob-sea), inset 0 0 0 9999px var(--bs-table-active-bg); }
  .table > tbody > tr[aria-selected="true"] > td { background: rgba(var(--bs-link-color-rgb), .13); }
  .list-group { --bs-list-group-active-bg: rgba(var(--bs-link-color-rgb), .13);
                --bs-list-group-active-color: var(--bs-body-color);
                --bs-list-group-active-border-color: var(--bs-border-color); }
  .list-group-item-action.active { box-shadow: inset 4px 0 var(--ob-sea); }
  .list-group-item.active .text-body-secondary { color: var(--bs-secondary-color) !important; }
  mark, .mark { background: #FFE58A; color: inherit; padding: 0 .15em; border-radius: .2em; }
  [data-bs-theme="dark"] mark, [data-bs-theme="dark"] .mark { background: #7A5F00; color: #fff; }
  ::selection { background: rgba(var(--bs-link-color-rgb), .3); }
  .table.kv td:first-child { color: var(--bs-secondary-color); width: 32%; }
  .table.kv td { padding: .5rem .25rem; }
  .num { font-variant-numeric: tabular-nums; }
  kbd { font-size: .8em; background: var(--bs-tertiary-bg); color: var(--bs-body-color);
        border: 1px solid var(--bs-border-color); box-shadow: none; }
  .meta { color: var(--bs-secondary-color); }
  .meta .sep { margin: 0 .45rem; opacity: .6; }
  @media (max-width: 767.98px) { [data-prio="low"] { display: none; } }

  /* the numbered code block every citation lands in: a manual's text, line for line */
  .code { font-family: var(--bs-font-monospace); font-size: .875rem; line-height: 1.55;
          background: var(--bs-tertiary-bg); border: 1px solid var(--bs-border-color-translucent);
          border-radius: .5rem; padding: .6rem 0; overflow-x: auto; }
  .code .ln { display: flex; padding: 0 .75rem; }
  .code .no { flex: 0 0 4.25em; text-align: right; padding-right: 1em; color: var(--bs-tertiary-color);
              user-select: none; }
  /* Extracted text arrives with pdftotext's column indentation — twenty spaces before
     a heading, a step number stranded on its own line. Runs of spaces collapse so a line
     reads as a sentence; the line itself stays exactly one source line, numbered. */
  .code .tx { flex: 1 1 auto; min-width: 0; white-space: normal; overflow-wrap: anywhere; }
  /* The thing a citation points at — a line in a manual, a block of prose in a note —
     wherever it is. */
  .hit, .code .hit { background: rgba(var(--bs-link-color-rgb), .13); box-shadow: inset 4px 0 var(--ob-sea); }
  .code .h { font-weight: 700; } .code .g { color: var(--bs-secondary-color); }
  .code .u { color: var(--bs-link-color); } .code .c { color: var(--bs-danger-text-emphasis); }
  .code .q { font-weight: 600; }

  /* the two sheets: search and keys */
  .ob-find .grp { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em;
                  color: var(--bs-secondary-color); background: var(--bs-tertiary-bg); }
  .ob-find .list-group-item small { display: block; }
</style>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script>
"use strict";
/* ── the shape of the thing ──────────────────────────────────────────────────────────
   Five views, one list-plus-split layout, and no state that outlives a reload. The page
   asks the API on every switch rather than caching, for the same reason `knowledge.py`
   re-reads its files: these documents are edited by hand, often in the middle of the job
   being asked about, and a stale answer about a boat is worse than a slow one.

   Nothing here writes. The console is a reader; the write surfaces are the snag service
   on its own port and a keyboard.                                                     */

/* Where this console is mounted, worked out from its own address rather than configured.
   Served plainly by the dashboard it is `/console.html` and ROOT is "". Behind the gate it
   is `/b/<key>/` or `/b/<key>/console.html` and ROOT is `/b/<key>` — the same page, one
   login and several boats in front of it. Every fetch and every service address below is
   built from it, so nothing on this page has to know which of the two it is.            */
const ROOT = location.pathname.replace(/\/[^/]*$/, "");

const $  = (s, r = document) => r.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t);
                            if (c) n.className = c;
                            if (txt !== undefined) n.textContent = txt;
                            return n; };

/* One shape for every failure, and it never throws. A view that has to wrap each fetch
   in its own try/catch grows one that somebody forgets, and a forgotten catch on this
   page is a blank panel where a fault list should be. So: always an object, and
   `.error` is a sentence when something went wrong. Offline is not exceptional here —
   it is Tuesday, with the boat ashore and the laptop on a kitchen table. */
async function api(path) {
  let r;
  try {
    r = await fetch(ROOT + path, { headers: { Accept: "application/json" } });
  } catch (e) {
    return { error: "the server is not answering", offline: true };
  }
  const j = await r.json().catch(() => null);
  if (j === null || typeof j !== "object")
    return { error: `the server answered ${r.status} ${r.statusText}` };
  if (!r.ok && !j.error) j.error = `the server answered ${r.status} ${r.statusText}`;
  return j;
}

/* Never innerHTML with anything that came off disk. Every code line is escaped first and
   the only markup added afterwards is the span colouring below, built from the escaped
   text — a manual containing a `<script>` is a manual, not an instruction. */
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const nf  = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString("en-GB");
const kb  = n => (n === null || n === undefined || isNaN(n)) ? "\u2014"
               : n < 1024 ? `${n} B`
               : n < 1048576 ? `${(n / 1024).toFixed(0)} kB`
               : `${(n / 1048576).toFixed(1)} MB`;

/* "3 days ago" beats an ISO string in a column you are scanning, but the exact stamp goes
   in the detail pane — an age is for comparing, a timestamp is for quoting. */
function ago(iso) {
  if (!iso) return "—";
  const then = new Date(iso.replace(" ", "T"));
  if (isNaN(then)) return iso;
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days < 0) return "in " + (-days) + " d";
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 60) return days + " d ago";
  if (days < 730) return Math.floor(days / 30) + " mo ago";
  return Math.floor(days / 365) + " y ago";
}

const ICON = {
  overview: "M12 3a9 9 0 100 18 9 9 0 000-18zm3.6 5.4l-2 5.2-5.2 2 2-5.2 5.2-2z",
  docs:     "M7 3h7l5 5v13H7zM14 3v5h5M10 13h7M10 17h7",
  tasks:    "M4 7l2 2 3.5-3.5M4 15l2 2 3.5-3.5M13 7h7M13 16h7",
  boards:   "M4 4h7v6H4zM13 4h7v10h-7zM4 13h7v7H4zM13 17h7v3h-7z",
  boat:     "M3 16h18l-2.5 5H5.5zM12 16V4l7 12M12 16H6l2-6h4",
};
const svg = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;

const VIEWS = [
  { id: "overview",  label: "Overview",   title: "Overview" },
  { id: "docs",      label: "Documents",  title: "Documents" },
  { id: "tasks",     label: "Tasks",      title: "Tasks" },
  { id: "inbox",     label: "Inbox",      title: "Inbox" },
  { id: "boards",    label: "Dashboards", title: "Dashboards" },
  { id: "boat",      label: "Boat",       title: "The boat" },
  { id: "connect",   label: "MCP connect", title: "Connect an assistant" },
];

const state = { view: "overview", sub: null, params: {}, q: "", docs: null, hits: null,
                sel: null, tasks: null, filter: "all", profile: null, stage: null, tab: {},
                /* the snag + service list, loaded once, so ⌘K can filter it in memory
                   rather than asking the boat again on every keystroke */
                index: null };

/* ── chrome ──────────────────────────────────────────────────────────────────────── */
const BI = { overview: "bi-speedometer2", docs: "bi-journal-text", tasks: "bi-check2-square",
             inbox: "bi-inbox", boards: "bi-grid-1x2", boat: "bi-life-preserver",
             connect: "bi-plug" };

function drawNav() {
  const nav = $("#nav");
  nav.textContent = "";
  for (const v of VIEWS) {
    const a = el("a", "nav-link" + (state.view === v.id ? " active" : ""));
    a.href = href(v.id);
    a.innerHTML = `<i class="bi ${BI[v.id]}"></i>${esc(v.label)}`;
    if (state.view === v.id) a.setAttribute("aria-current", "page");
    // On a phone the pages live in an offcanvas; picking one should also close it.
    a.onclick = () => { const oc = bootstrap.Offcanvas.getInstance($("#sidebar"));
                        if (oc) oc.hide(); };
    nav.append(a);
  }
}

/* ── shared furniture ────────────────────────────────────────────────────────────
   Every helper below returns a stock Bootstrap component. The views call these rather
   than writing markup, so the page stays one system:

     toolbar(placeholder, onInput, extras)  a search field with a clear button; extras
                                            are Nodes placed after it (chips, selects)
     table(cols, rows, onPick, selected)    cols = [{label, get(row,i), w, cls, prio}];
                                            rows become <tr role=button>. prio:"low"
                                            columns disappear on a phone
     statusCell(kind, text)                 a pill badge: ok | warn | bad | info | muted
     pane(title, side, meta)                a .card with a header; append .card-body,
                                            a .table or a .list-group to it
     cardBody(...nodes)                     a .card-body holding the nodes
     tabs(names, active, onPick, right)     nav-tabs
     kv(pairs, heads)                       a two-column table; heads null drops the
                                            header row
     crumbs([{label, href}])                a breadcrumb; the last item is plain
     pageHead(title, meta, actions)         h1 + meta line + right-aligned actions
     note(kind, text)                       a slim alert: loading | empty | error |
                                            warn | ok | info
     code(text, hitLine, whole)             a numbered code block, line for line
     mount(node)                            replace the page with node                */

function toolbar(placeholder, onInput, extras) {
  const wrap = el("div", "d-flex flex-wrap align-items-center gap-2 mb-3");
  const group = el("div", "input-group flex-grow-1");
  group.style.minWidth = "240px";
  const ic = el("span", "input-group-text");
  ic.innerHTML = '<i class="bi bi-search"></i>';
  const input = el("input", "form-control form-control-lg");
  input.type = "search";
  input.placeholder = placeholder;
  input.value = state.q;
  input.setAttribute("aria-label", placeholder);
  input.oninput = () => { state.q = input.value; onInput(input.value); };
  const clear = el("button", "btn btn-outline-secondary");
  clear.type = "button";
  clear.title = "Clear";
  clear.innerHTML = '<i class="bi bi-x-lg"></i>';
  clear.onclick = () => { state.q = ""; input.value = ""; onInput(""); input.focus(); };
  group.append(ic, input, clear);
  wrap.append(group);
  (extras || []).forEach(n => wrap.append(n));
  // No auto-focus: it stole the j/k keys on a desk and raised the keyboard on a phone
  // every time the list drew. `/` focuses it when wanted.
  return wrap;
}

function table(cols, rows, onPick, selected) {
  const wrap = el("div", "table-responsive");
  const t = el("table", "table table-hover align-middle mb-0");
  const cg = el("colgroup");
  cols.forEach(c => { const col = el("col"); if (c.w) col.style.width = c.w; cg.append(col); });
  t.append(cg);
  const thead = el("thead"), tr = el("tr");
  cols.forEach(c => { const th = el("th", c.cls || "", c.label);
                      th.scope = "col";
                      if (c.prio) th.dataset.prio = c.prio;
                      tr.append(th); });
  thead.append(tr); t.append(thead);
  const tb = el("tbody");
  rows.forEach((row, i) => {
    const r = el("tr", selected === i ? "table-active" : "");

  });
  t.append(tb);
  wrap.append(t);
  if (!rows.length) wrap.append(el("div", "text-body-secondary p-3", "Nothing here."));
  return wrap;
}

/* Kept for the views that still draw their own icon: the old inline paths. */
/* ── routing ──────────────────────────────────────────────────────────────────────
   One address per thing. The hash is `view`, `view/sub`, or either with `?k=v`:
     #docs                 the shelf          #docs?q=impeller        a search
     #docs/pump-7j.md      one document       #docs/pump-7j.md/L212   a line in it
     #tasks/<id>           one snag or service item
   `route()` parses that into state.view / state.sub / state.params, and `nav()` is the only
   way a view moves: it writes the hash, and the hashchange handler does the rest, so the
   browser's back button is the console's back button and every page has a URL. */
function route() {
  const raw = location.hash.slice(1);
  const [pathPart, query = ""] = raw.split("?");
  const [view, ...rest] = pathPart.split("/");
  const params = {};
  for (const [k, v] of new URLSearchParams(query)) params[k] = v;
  // A hash somebody typed can carry a stray % ("#docs/50%"). decodeURIComponent throws
  // on that, and a throw here comes out of the hashchange handler and stops the router
  // moving at all. An undecodable sub is worth showing as itself.
  const raw_sub = rest.join("/");
  let sub = null;
  if (rest.length) { try { sub = decodeURIComponent(raw_sub); } catch (e) { sub = raw_sub; } }
  return { view: VIEWS.some(v => v.id === view) ? view : "overview", sub, params };
}

function href(view, sub, params) {
  let h = "#" + view;
  if (sub) h += "/" + encodeURIComponent(sub).replace(/%2F/g, "/");
  const qs = new URLSearchParams(params || {}).toString();
  return qs ? h + "?" + qs : h;
}

function nav(view, sub, params) {
  const target = href(view, sub, params);
  if (location.hash === target) return apply();
  location.hash = target;
}

function apply() {
  const r = route();
  const changed = r.view !== state.view;
  state.view = r.view;
  state.sub = r.sub;
  state.params = r.params;
  state.stage = null;
  if (changed) {
    // The search box is per view. Carrying a query across meant arriving at Tasks with a
    // manual's vocabulary typed into it and being told, correctly and uselessly, that
    // nothing matched.
    state.q = "";
    state.sel = null;
  }
  if (r.params.q !== undefined) state.q = r.params.q;
  drawNav();
  $("#title").textContent = (VIEWS.find(v => v.id === state.view) || {}).title || state.view;
  render();
}

function go(view) { nav(view); }

window.addEventListener("hashchange", apply);

const MAX_LINES = 2200;
const RICH = /https?:\/\/|`|\*\*|^\s{0,3}(?:#{1,6}\s|>)/;

function code(text, hitLine, whole) {
  const box = el("div", "code");
  const lines = String(text ?? "").split("\n");

  let from = 0, to = lines.length;
  if (!whole && lines.length > MAX_LINES) {
    const centre = hitLine ? hitLine - 1 : 0;
    to = Math.min(lines.length, Math.max(centre + Math.floor(MAX_LINES / 2), MAX_LINES));
    from = Math.max(0, to - MAX_LINES);
    const bar = el("div", "d-flex flex-wrap align-items-center gap-2 px-3 pb-2");
    bar.append(statusCell("info",
      `Showing lines ${nf(from + 1)}–${nf(to)} of ${nf(lines.length)}.`));
    const more = el("button", "btn btn-link btn-sm p-0");
    more.type = "button";
    more.textContent = `Show the whole file ▸`;
    more.onclick = () => box.replaceWith(code(text, hitLine, true));
    bar.append(more);
    box.append(bar);
  }

  const frag = document.createDocumentFragment();
  for (let i = from; i < to; i++) {
    const line = lines[i], n = i + 1;
    const row = el("div", "ln" + (hitLine && n === hitLine ? " hit" : ""));
    row.id = "L" + n;
    row.append(el("span", "no", String(n)));
    const tx = el("span", "tx");
    if (!RICH.test(line)) {
      tx.textContent = line;                       // the common case, and the fast one
    } else {
      let html = esc(line);
      if (/^\s{0,3}#{1,6}\s/.test(line))     html = `<span class="h">${html}</span>`;
      else if (/^\s{0,3}>/.test(line))       html = `<span class="g">${html}</span>`;
      html = html
        .replace(/(https?:\/\/[^\s&<]+)/g, '<span class="u">$1</span>')
        .replace(/(`[^`]+`)/g, '<span class="c">$1</span>')
        .replace(/(\*\*[^*]+\*\*)/g, '<span class="q">$1</span>');
      tx.innerHTML = html;
    }
    row.append(tx);
    frag.append(row);
  }
  box.append(frag);
  return box;
}

function mount(node) { const m = $("#main"); m.textContent = ""; m.append(node); }

/* ── the one write, and it is not to this server ──────────────────────────────────
   The dashboard behind this page accepts no writes from it, and the test that keeps it so
   reads this file. What a person can do from the Tasks page is change a snag's status —
   "review" when somebody has an idea, "fixed" when it was done — and that is a follow-up
   entry appended to the boat's own file by the snag service on its own port, the same
   service the phone page files to. Nothing is rewritten: the status is the newest line
   anybody wrote about the fault. Every write goes through here, so there is exactly one
   place that knows the service's address, and the console's own `/api/` is never a
   target. `snags` is the object `/api/snags` returned (it carries the boat key and the
   service's port); `body` is {follow_up_to, status, note, by}. `path` names the route on
   that service and defaults to the snag write — the one other caller is the intake view,
   which accepts an item, and it goes through here for the same reason.

   Behind the gate there is no second port and no second origin: the service is relayed at
   `<ROOT>/snag`, which is what `snagOrigin` returns there. The gate then forces the boat
   and the sender's name onto the request from the session, so what this page puts in the
   body is a suggestion the server overrules rather than a claim it believes.           */
function snagOrigin(snags) {
  return ROOT ? ROOT + "/snag"
              : `${location.protocol}//${location.hostname}:${snags.photo_port}`;
}
async function snagPost(snags, body, path) {
  const url = snagOrigin(snags) + (path || "/api/snag")
            + "?who=" + encodeURIComponent(body.by || "");
  let r;
  try {
    r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify({ boat: snags.boat, ...body }) });
  } catch (e) {
    return { error: `the snag service on :${snags.photo_port} is not answering` };
  }
  const j = await r.json().catch(() => null);
  if (!j || typeof j !== "object") return { error: `the snag service answered ${r.status}` };
  if (!r.ok && !j.error) j.error = `the snag service answered ${r.status}`;
  return j;
}

function sentence(text, max) {
  const s = String(text ?? "").replace(/\s+/g, " ").trim();
  if (!s) return "";
  const lim = max || 150;
  const stop = s.search(/[.!?…](?:\s|$)/);
  if (stop > 0 && stop + 1 <= lim) return s.slice(0, stop + 1);
  if (s.length <= lim) return s;
  const cut = s.lastIndexOf(" ", lim);
  return s.slice(0, cut > Math.min(40, lim - 20) ? cut : lim).trimEnd() + "…";
}

function since(iso) {
  if (!iso) return "—";
  const then = new Date(String(iso).replace(" ", "T"));
  if (isNaN(then)) return String(iso);
  const s = Math.round((Date.now() - then) / 1000);
  const span = n => n < 60 ? `${n} s`
                  : n < 3600 ? `${Math.round(n / 60)} min`
                  : n < 86400 ? `${Math.round(n / 3600)} h`
                  : `${Math.floor(n / 86400)} d`;
  if (s < 0) return "in " + span(-s);
  if (s < 5) return "just now";
  return span(s) + " ago";
}

async function taskIndex() {
  if (state.index) return state.index;
  const [snags, maint] = await Promise.all([api("/api/snags"), api("/api/maintenance")]);
  // An empty index off a failed request is not an index, and caching it would make one
  // bad moment permanent for the life of the tab. Report it and ask again next time.
  if (snags.error || maint.error)
    return { error: snags.error || maint.error, snags: [], service: [] };
  state.index = { snags: snags.snags || [], service: maint.items || [] };
  return state.index;
}


/* ── the keyboard ─────────────────────────────────────────────────────────────────
   This page is read at a desk by somebody who is already annoyed, so the keys are the
   ones their hands already know: `/` for the box on this page, `?` for the card that
   says what the keys are, `g` then a letter to move, ⌘K to search everything. Nothing
   fires while you are typing into something, and Esc always closes what is open.
   The sheets are Bootstrap modals, built once and thrown away on close.            */

const CHORD = { o: "overview", d: "docs", t: "tasks", i: "inbox", s: "boards",
                b: "boat" };
let chordAt = 0;

const typingIn = t => !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA"
                              || t.isContentEditable);
const overlay = () => $(".modal.show, .modal.showing");

function closeOverlay() {
  const m = overlay();
  if (!m) return false;
  const inst = bootstrap.Modal.getInstance(m);
  if (inst) inst.hide(); else m.remove();
  return true;
}

/* openOverlay(content, {title, size}) → the modal element. Content goes in the body;
   a title, when given, gets a header with a close button. Removed from the DOM once
   hidden, so nothing accumulates. */
function openOverlay(content, opts) {
  closeOverlay();
  const o = opts || {};
  const m = el("div", "modal fade" + (o.cls ? " " + o.cls : ""));
  m.tabIndex = -1;
  const dlg = el("div", "modal-dialog modal-dialog-scrollable " + (o.size || "modal-lg"));
  const box = el("div", "modal-content");
  if (o.title) {
    const h = el("div", "modal-header");
    h.append(el("h2", "modal-title h5", o.title));
    const x = el("button", "btn-close"); x.type = "button";
    x.setAttribute("data-bs-dismiss", "modal"); x.setAttribute("aria-label", "Close");
    h.append(x);
    box.append(h);
  }
  box.append(content);
  dlg.append(box);
  m.append(dlg);
  document.body.append(m);
  m.addEventListener("hidden.bs.modal", () => m.remove());
  const inst = new bootstrap.Modal(m);
  inst.show();
  return m;
}

function openKeys() {
  const body = el("div", "modal-body p-0");
  const t = el("table", "table mb-0 align-middle"), tb = el("tbody");
  [["⌘K Ctrl-K", "search the papers and the tasks"],
   ["/",         "the search box on this page"],
   ["g o",       "Overview"],
   ["g d",       "Documents"],
   ["g t",       "Tasks"],
   ["g i",       "Inbox"],
   ["g s",       "Dashboards"],
   ["g b",       "Boat"],
   ["?",         "this card"],
   ["Esc",       "close this, or leave a page you opened"]].forEach(([keys, what]) => {
    const tr = el("tr"), kcell = el("td", "text-nowrap");
    kcell.style.width = "9rem";
    keys.split(" ").forEach((part, i) => {
      if (i) kcell.append(document.createTextNode(" "));
      kcell.append(el("kbd", "", part));
    });
    tr.append(kcell, el("td", "", what));
    tb.append(tr);
  });
  t.append(tb);
  body.append(t);
  openOverlay(body, { title: "Keyboard", size: "modal-md" });
}

function openFind() {
  const wrap = el("div", "ob-find");
  const field = el("div", "p-3 border-bottom");
  const group = el("div", "input-group input-group-lg");
  const ic = el("span", "input-group-text"); ic.innerHTML = '<i class="bi bi-search"></i>';
  const input = el("input", "form-control");
  input.type = "search";
  input.placeholder = "Search the papers and the tasks…";
  input.setAttribute("aria-label", "Search everything");
  group.append(ic, input);
  field.append(group);
  const out = el("div", "list-group list-group-flush");
  wrap.append(field, out);
  const m = openOverlay(wrap, { size: "modal-lg", cls: "ob-find-modal" });
  m.addEventListener("shown.bs.modal", () => input.focus());

  /* A row is {group, title, line, view, addr}: `addr` is the sub-path the address needs,
     so opening one is nav(view, addr) and nothing else. */
  let rows = [], sel = 0, timer = 0, token = 0, failure = null;

  const open = i => {
    const r = rows[i];
    if (!r) return;
    closeOverlay();
    nav(r.view, r.addr);
  };

  const line = (kind, text) => {
    const d = el("div", "list-group-item text-body-secondary", text);
    if (kind === "error") d.className = "list-group-item text-danger";
    return d;
  };

  const paint = () => {
    out.textContent = "";
    if (input.value.trim().length < 2) {
      out.append(line("info", "Two letters and it starts looking. ↑↓ to choose, Enter to open, Esc to close."));
      return;
    }
    if (failure) { out.append(line("error", failure)); return; }
    if (!rows.length) { out.append(line("info", "Nothing matched that.")); return; }
    let group = null;
    rows.forEach((r, i) => {
      if (r.group !== group) { group = r.group; out.append(el("div", "list-group-item grp py-1", group)); }
      const a = el("a", "list-group-item list-group-item-action" + (i === sel ? " active" : ""));
      a.href = href(r.view, r.addr);
      if (i === sel) a.setAttribute("aria-current", "true");
      a.append(el("span", "fw-medium", r.title));
      a.append(el("small", "text-body-secondary", r.line));
      a.onclick = e => { e.preventDefault(); open(i); };
      out.append(a);
    });
  };

  const run = async () => {
    const q = input.value.trim();
    const mine = ++token;
    if (q.length < 2) { rows = []; sel = 0; failure = null; paint(); return; }
    const [res, idx] = await Promise.all([
      api("/api/ask?q=" + encodeURIComponent(q)), taskIndex(),
    ]);
    if (mine !== token) return;                       // a later keystroke already won
    // "Nothing matched that" off a server that never answered is the wrong sentence: it
    // says the boat does not have it, and what happened is that nobody could ask.
    failure = res.error || idx.error || null;
    if (failure) { rows = []; sel = 0; paint(); return; }
    const needle = q.toLowerCase();
    const has = (...bits) => bits.some(b => String(b ?? "").toLowerCase().includes(needle));
    const plain = t => String(t ?? "").replace(/[*`_>#|]+/g, " ");
    const papers = (res.passages || []).slice(0, 5).map(p => ({
      group: "In the papers",
      title: p.heading || p.doc || "a passage",
      line: `${p.doc || ""} · line ${nf(p.line)} · ${sentence(plain(p.text), 80)}`,
      view: "docs", addr: `${p.doc}/L${p.line}`,
    }));
    const snags = (idx.snags || []).filter(s => has(s.title, s.where, s.body))
      .slice(0, 4).map(s => ({
        group: "Tasks",
        title: s.title || "an untitled snag",
        line: `${s.open ? "open" : "closed"} · ${s.where || "snag"} · ${ago(s.when)}`,
        view: "tasks", addr: "snag:" + s.when,
      }));
    const svc = (idx.service || []).filter(m => has(m.item, m.description, m.why))
      .slice(0, 4).map(m => ({
        group: "Tasks",
        title: m.description || m.item || "a service item",
        line: `${m.verdict || "service"} · ${sentence(m.why, 80)}`,
        view: "tasks", addr: "service:" + m.item,
      }));
    rows = papers.concat(snags, svc).slice(0, 8);
    sel = 0;
    paint();
  };

  input.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 180); };
  input.onkeydown = e => {
    if (e.key === "ArrowDown") {
      e.preventDefault(); sel = Math.min(sel + 1, Math.max(rows.length - 1, 0)); paint();
    } else if (e.key === "ArrowUp") {
      e.preventDefault(); sel = Math.max(sel - 1, 0); paint();
    } else if (e.key === "Enter") {
      e.preventDefault(); open(sel);
    }
  };
  paint();
}

$("#findbtn").onclick = openFind;
$("#keysbtn").onclick = openKeys;

document.addEventListener("keydown", e => {
  const k = e.key;
  if ((e.metaKey || e.ctrlKey) && (k === "k" || k === "K")) {
    e.preventDefault();
    if (overlay()) closeOverlay(); else openFind();
    return;
  }
  if (k === "Escape") { if (closeOverlay()) e.preventDefault(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (typingIn(e.target) || overlay()) return;
  if (k === "/") {
    e.preventDefault();
    const box = $("#main input[type=search]") || $("#main input[type=text]");
    if (box) { box.focus(); if (box.select) box.select(); } else openFind();
    return;
  }
  if (k === "?") { e.preventDefault(); openKeys(); return; }
  if (k === "g") { chordAt = Date.now(); return; }
  if (chordAt && Date.now() - chordAt < 1400 && CHORD[k]) { chordAt = 0; nav(CHORD[k]); return; }
  chordAt = 0;
});

<script>
/* ── go ──────────────────────────────────────────────────────────────────────────── */
/* A view is a function, looked up by name. `inbox` is written beside this file rather
   than in it, so the map is built from what actually loaded: a script that is not there
   yet — or that failed to parse — leaves the page on the overview instead of leaving it
   blank, which is the difference between a missing page and a broken console.        */
function render() {
  const views = { overview: viewOverview, docs: viewDocs, tasks: viewTasks,
                  boards: viewBoards, boat: viewBoat, connect: viewConnect,
                  inbox: typeof viewInbox === "function" ? viewInbox : undefined };
  (views[state.view] || viewOverview)();
}

/* Who is reading this, when anybody had to say. Only asked for when ROOT is non-empty,
   because served plainly there is no gate, no account and no route to ask — and a 404 on
   every load would be a lie about what this page is. What comes back is put in the navbar
   and on `window.OB_USER`, so a view can ask who is signed in without asking again.    */
async function whoami() {
  if (!ROOT) return null;
  const me = await api("/me");
  if (!me || me.error) return null;
  window.OB_USER = me;

  const boats = me.boats || [];
  if (boats.length > 1) {
    /* More than one boat and the switcher is the only way between them: each entry is the
       same page on another boat, carrying the hash across so switching from a document on
       one boat lands on the same view of the other rather than back at the overview. It
       sits where the boat's name sits, because that is what it changes — putting it over
       on the account side made the bar say the boat's name twice and mean it once. */
    const boatbox = $("#boatbox");
    boatbox.textContent = "";
    const drop = el("div", "dropdown");
    const btn = el("button", "btn btn-light border btn-sm dropdown-toggle ob-boat text-truncate");
    btn.type = "button";
    btn.setAttribute("data-bs-toggle", "dropdown");
    const here = boats.find(b => b.key === me.boat);
    btn.textContent = (here && here.name) || me.boat || "Boats";
    const menu = el("ul", "dropdown-menu");
    for (const b of boats) {
      const li = el("li");
      const a = el("a", "dropdown-item" + (b.key === me.boat ? " active" : ""), b.name || b.key);
      a.href = "/b/" + encodeURIComponent(b.key) + "/" + location.hash;
      li.append(a);
      menu.append(li);
    }
    drop.append(btn, menu);
    boatbox.append(drop);
  }

  /* The account, behind one control. A name and a way out are the whole of it, and
     neither is worth a permanent line across the top of every page. */
  const box = $("#gate");
  box.textContent = "";
  box.className = "d-flex align-items-center";

  const label = me.name || me.email || "";
  const drop = el("div", "dropdown");
  const btn = el("button", "btn btn-light border btn-sm ob-me dropdown-toggle d-flex align-items-center gap-2");
  btn.type = "button";
  btn.setAttribute("data-bs-toggle", "dropdown");
  btn.setAttribute("aria-label", label ? "Account: " + label : "Account");
  const face = el("span", "ob-face", (label.trim()[0] || "?").toUpperCase());
  const first = el("span", "d-none d-md-inline small text-truncate", label.split(/\s+/)[0] || "");
  first.style.maxWidth = "9rem";
  btn.append(face, first);

  const menu = el("ul", "dropdown-menu dropdown-menu-end");
  const head = el("li");
  const hd = el("div", "px-3 py-2");
  hd.append(el("div", "fw-semibold text-truncate", me.name || me.email || "Signed in"));
  if (me.name && me.email) hd.append(el("div", "small text-body-secondary text-truncate", me.email));
  head.append(hd);
  const hr = el("li"); hr.append(el("hr", "dropdown-divider"));

  const keys = el("li");
  const kb = el("button", "dropdown-item", "Keyboard shortcuts");
  kb.type = "button";
  kb.onclick = openKeys;
  keys.append(kb);

  const hr2 = el("li"); hr2.append(el("hr", "dropdown-divider"));
  const outli = el("li");
  const out = el("a", "dropdown-item", "Sign out");
  out.href = "/logout";
  outli.append(out);

  menu.append(head, hr, keys, hr2, outli);
  drop.append(btn, menu);
  box.append(drop);

  const who = $("#who");
  who.textContent = "";
  who.append(el("i", "bi bi-person me-1"));
  who.append(document.createTextNode(me.name || me.email || ""));
  return me;
}

(async function boot() {
  apply();
  whoami();
  const p = await api("/api/profile");
  if (p.error) {
    const vn = $("#vname");
    if (vn) vn.textContent = p.error;
    return;
  }
  state.profile = p;
  /* Both may already be gone: `whoami` replaces the name with a switcher when there is
     more than one boat, and it does not wait for this. */
  const vn = $("#vname");
  if (vn) vn.textContent = (p.vessel && p.vessel.name) || "no profile";
  const vv = $("#vver");
  if (vv) vv.textContent = "v" + (p.version || "?");
})();
</script>
</body>
</html>
